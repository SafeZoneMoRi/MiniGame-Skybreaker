<div id="game-container">
  <canvas id="gameCanvas" width="960" height="540"></canvas>
  <div id="audio-prompt">🔊 Audio Enabled on Click</div>
</div>

<script>
/**
 * 🚀 SKYBREAKER - Endless Air Raid Survival & GoF Command Replay System
 * Architecture: Object-Oriented Programming (OOP) & GoF Command Pattern
 */

// ==========================================
// 1. SOUND SYNTHESIZER (Web Audio API)
// ==========================================
class SoundSynth {
  constructor() {
    this.ctx = null;
  }
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }
  playCannon() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(180, t);
    osc.frequency.exponentialRampToValueAtTime(30, t + 0.18);
    gain.gain.setValueAtTime(0.4, t);
    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.18);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(t);
    osc.stop(t + 0.18);
  }
  playExplosion() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(110, t);
    osc.frequency.exponentialRampToValueAtTime(20, t + 0.35);
    gain.gain.setValueAtTime(0.45, t);
    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.35);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(t);
    osc.stop(t + 0.35);
  }
  playNuke() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(60, t);
    osc.frequency.linearRampToValueAtTime(260, t + 0.6);
    osc.frequency.exponentialRampToValueAtTime(20, t + 1.2);
    gain.gain.setValueAtTime(0.6, t);
    gain.gain.exponentialRampToValueAtTime(0.01, t + 1.2);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(t);
    osc.stop(t + 1.2);
  }
  playSupply() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(440, t);
    osc.frequency.setValueAtTime(880, t + 0.1);
    gain.gain.setValueAtTime(0.3, t);
    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(t);
    osc.stop(t + 0.3);
  }
  playHit() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(140, t);
    osc.frequency.exponentialRampToValueAtTime(50, t + 0.08);
    gain.gain.setValueAtTime(0.2, t);
    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.08);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(t);
    osc.stop(t + 0.08);
  }
}
const audio = new SoundSynth();

// ==========================================
// 2. GOF COMMAND PATTERN INTERFACES & COMMANDS
// ==========================================

class ICommand {
  constructor(name) {
    this.name = name;
  }
  execute(target) {
    throw new Error("Execute must be implemented by concrete command");
  }
}

class MoveTankCommand extends ICommand {
  constructor(directionX) {
    super("MoveTankCommand");
    this.directionX = directionX;
  }
  execute(target) {
    target.move(this.directionX);
  }
}

class AimTurretCommand extends ICommand {
  constructor(angleDeg) {
    super("AimTurretCommand");
    this.angleDeg = angleDeg;
  }
  execute(target) {
    target.aimTurret(this.angleDeg);
  }
}

class FireCannonCommand extends ICommand {
  constructor() {
    super("FireCannonCommand");
  }
  execute(target) {
    target.fire();
  }
}

class DeployNukeCommand extends ICommand {
  constructor() {
    super("DeployNukeCommand");
  }
  execute(target) {
    target.deployNuke();
  }
}

// ==========================================
// 3. RECEIVER HIERARCHY (ITankReceiver & Tanks)
// ==========================================

class ITankReceiver {
  move(dirX) {}
  aimTurret(angleDeg) {}
  fire() {}
  deployNuke() {}
  takeDamage(amt) {}
  reset(pos) {}
}

class TankBase extends ITankReceiver {
  constructor(name, x, y) {
    super();
    this.name = name;
    this.position = { x: x, y: y };
    this.turretAngleDeg = -45;
    this.health = 100;
    this.maxHealth = 100;
    this.nukeCount = 2;
    this.speed = 360;
    this.width = 64;
    this.height = 32;
    this.fireCooldown = 0;
  }
  get isAlive() {
    return this.health > 0;
  }
  get bounds() {
    return {
      x: this.position.x - this.width / 2,
      y: this.position.y - this.height / 2,
      w: this.width,
      h: this.height
    };
  }
  move(dirX) {
    this.pendingMoveX = dirX;
  }
  aimTurret(angleDeg) {
    this.turretAngleDeg = angleDeg;
  }
  update(dt, minX, maxX) {
    if (this.pendingMoveX) {
      this.position.x += this.pendingMoveX * this.speed * dt;
      this.pendingMoveX = 0;
    }
    if (this.position.x < minX) this.position.x = minX;
    if (this.position.x > maxX) this.position.x = maxX;
    if (this.fireCooldown > 0) this.fireCooldown -= dt;
  }
  draw(ctx, bodyColor, accentColor, barrelColor, alpha = 1.0) {
    ctx.save();
    ctx.globalAlpha = alpha;
    const px = this.position.x;
    const py = this.position.y;

    // Turret Barrel
    ctx.save();
    ctx.translate(px, py - 12);
    ctx.rotate((this.turretAngleDeg * Math.PI) / 180);
    ctx.fillStyle = barrelColor;
    ctx.fillRect(0, -4, 38, 8);
    // Muzzle brake
    ctx.fillStyle = accentColor;
    ctx.fillRect(34, -6, 6, 12);
    ctx.restore();

    // Tank Treads
    ctx.fillStyle = "#111820";
    ctx.fillRect(px - 34, py + 4, 68, 14);
    ctx.fillStyle = "#2a3644";
    for (let i = -28; i <= 28; i += 12) {
      ctx.beginPath();
      ctx.arc(px + i, py + 11, 4, 0, Math.PI * 2);
      ctx.fill();
    }

    // Main Chassis
    ctx.fillStyle = bodyColor;
    ctx.beginPath();
    ctx.moveTo(px - 32, py + 4);
    ctx.lineTo(px - 26, py - 8);
    ctx.lineTo(px + 26, py - 8);
    ctx.lineTo(px + 32, py + 4);
    ctx.closePath();
    ctx.fill();

    // Turret Dome
    ctx.fillStyle = accentColor;
    ctx.beginPath();
    ctx.arc(px, py - 10, 14, Math.PI, 0);
    ctx.fill();

    ctx.restore();
  }
}

class PlayerTank extends TankBase {
  constructor(x, y, onFire, onNuke) {
    super("PlayerTank", x, y);
    this.onFire = onFire;
    this.onNuke = onNuke;
  }
  fire() {
    if (this.fireCooldown <= 0 && this.isAlive) {
      this.fireCooldown = 0.16;
      this.onFire(this);
    }
  }
  deployNuke() {
    if (this.nukeCount > 0 && this.isAlive) {
      this.nukeCount--;
      this.onNuke(this);
    }
  }
  takeDamage(amt) {
    this.health -= amt;
    if (this.health < 0) this.health = 0;
    audio.playHit();
  }
  draw(ctx) {
    super.draw(ctx, "#2e7d32", "#4caf50", "#81c784", 1.0);
  }
}

class GhostTank extends TankBase {
  constructor(x, y, onFire, onNuke) {
    super("GhostTank", x, y);
    this.onFire = onFire;
    this.onNuke = onNuke;
    this.isTheaterMode = false;
  }
  fire() {
    this.onFire(this);
  }
  deployNuke() {
    this.onNuke(this);
  }
  takeDamage(amt) {} // Invulnerable during replay
  draw(ctx) {
    super.draw(ctx, "#00838f", "#00e5ff", "#80deea", 0.85);
  }
}

// ==========================================
// 4. REPLAY RECORDER & PLAYBACK ENGINE
// ==========================================

class TimedCommand {
  constructor(timestamp, command) {
    this.timestamp = timestamp;
    this.command = command;
  }
}

class CommandRecorder {
  constructor() {
    this.history = [];
    this.isRecording = false;
  }
  start() {
    this.history = [];
    this.isRecording = true;
  }
  record(cmd, timestamp) {
    if (this.isRecording) {
      this.history.push(new TimedCommand(timestamp, cmd));
    }
  }
  stop() {
    this.isRecording = false;
  }
}

class GhostPlaybackEngine {
  constructor() {
    this.queue = [];
    this.isPlaying = false;
    this.totalDuration = 0;
  }
  load(history) {
    this.queue = [...history];
    this.totalDuration = history.length > 0 ? history[history.length - 1].timestamp : 0;
    this.isPlaying = true;
  }
  update(currentTime, target) {
    while (this.queue.length > 0 && this.queue[0].timestamp <= currentTime) {
      const tc = this.queue.shift();
      tc.command.execute(target);
    }
    if (this.queue.length === 0) {
      this.isPlaying = false;
    }
  }
}

// ==========================================
// 5. ENTITY HIERARCHY (PROJECTILES, BOMBS, ENEMIES)
// ==========================================

class Projectile {
  constructor(x, y, vx, vy) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.isAlive = true;
  }
  update(dt) {
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    if (this.x < -20 || this.x > 980 || this.y < -20 || this.y > 560) {
      this.isAlive = false;
    }
  }
  draw(ctx) {
    ctx.save();
    ctx.fillStyle = "#ffeb3b";
    ctx.beginPath();
    ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

class Bomb {
  constructor(x, y, vx, vy, type = "HeavyBomb", damage = 35) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.type = type;
    this.damage = damage;
    this.isAlive = true;
  }
  update(dt, targetX) {
    if (this.type === "GuidedRocket") {
      const dx = targetX - this.x;
      this.vx += Math.sign(dx) * 140 * dt;
      this.vy += 220 * dt;
    } else if (this.type === "HeavyBomb") {
      this.vy += 320 * dt; // gravity
    } else {
      // Machine gun bullet
      this.vy += 20 * dt;
    }
    this.x += this.vx * dt;
    this.y += this.vy * dt;

    if (this.y > 470) {
      this.isAlive = false;
    }
  }
  draw(ctx) {
    ctx.save();
    if (this.type === "HeavyBomb") {
      ctx.fillStyle = "#ff1744";
      ctx.beginPath();
      ctx.ellipse(this.x, this.y, 5, 8, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#212121";
      ctx.fillRect(this.x - 4, this.y - 8, 8, 3);
    } else if (this.type === "GuidedRocket") {
      ctx.fillStyle = "#ff9100";
      ctx.fillRect(this.x - 3, this.y - 6, 6, 12);
      ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
      ctx.beginPath();
      ctx.arc(this.x, this.y - 8, 3, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = "#ff5252";
      ctx.fillRect(this.x - 2, this.y - 4, 4, 8);
    }
    ctx.restore();
  }
}

class SupplyDrop {
  constructor(x, y, type) {
    this.x = x;
    this.y = y;
    this.type = type; // "Health" (+35) or "Nuke" (+1)
    this.isCollected = false;
    this.vy = 65;
  }
  update(dt) {
    this.y += this.vy * dt;
    if (this.y > 454) this.y = 454;
  }
  draw(ctx) {
    ctx.save();
    // Parachute
    if (this.y < 450) {
      ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
      ctx.beginPath();
      ctx.arc(this.x, this.y - 14, 14, Math.PI, 0);
      ctx.fill();
      ctx.strokeStyle = "rgba(255, 255, 255, 0.5)";
      ctx.beginPath();
      ctx.moveTo(this.x - 14, this.y - 14);
      ctx.lineTo(this.x - 6, this.y);
      ctx.moveTo(this.x + 14, this.y - 14);
      ctx.lineTo(this.x + 6, this.y);
      ctx.stroke();
    }
    // Crate
    ctx.fillStyle = this.type === "Health" ? "#00c853" : "#ffd600";
    ctx.fillRect(this.x - 10, this.y, 20, 16);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 12px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(this.type === "Health" ? "+" : "☢", this.x, this.y + 13);
    ctx.restore();
  }
}

// Enemy Plane Base (Polymorphism)
class EnemyPlaneBase {
  constructor(x, y, speed, health, score) {
    this.x = x;
    this.y = y;
    this.speed = speed;
    this.health = health;
    this.maxHealth = health;
    this.scoreValue = score;
    this.isAlive = true;
    this.dir = Math.random() < 0.5 ? 1 : -1;
    this.x = this.dir === 1 ? -60 : 1020;
  }
  takeDamage(dmg) {
    this.health -= dmg;
    if (this.health <= 0) {
      this.isAlive = false;
      audio.playExplosion();
      return true;
    }
    return false;
  }
}

class FighterJet extends EnemyPlaneBase {
  constructor(y) {
    super(0, y, 240, 25, 100);
    this.shootTimer = 0.5 + Math.random() * 0.5;
  }
  update(dt, onDropBomb) {
    this.x += this.dir * this.speed * dt;
    this.shootTimer -= dt;
    if (this.shootTimer <= 0) {
      this.shootTimer = 0.8 + Math.random() * 0.6;
      onDropBomb(new Bomb(this.x, this.y + 10, this.dir * 40, 180, "Bullet", 12));
    }
    if ((this.dir === 1 && this.x > 1050) || (this.dir === -1 && this.x < -90)) {
      this.isAlive = false;
    }
  }
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    if (this.dir === -1) ctx.scale(-1, 1);
    ctx.fillStyle = "#37474f";
    ctx.beginPath();
    ctx.moveTo(25, 0);
    ctx.lineTo(-20, -10);
    ctx.lineTo(-12, 0);
    ctx.lineTo(-20, 10);
    ctx.closePath();
    ctx.fill();
    // Jet flame
    ctx.fillStyle = "#00e5ff";
    ctx.fillRect(-26, -3, 8, 6);
    ctx.restore();
  }
}

class BomberPlane extends EnemyPlaneBase {
  constructor(y) {
    super(0, y, 140, 60, 250);
    this.dropCooldown = 1.0;
  }
  update(dt, onDropBomb) {
    this.x += this.dir * this.speed * dt;
    this.dropCooldown -= dt;
    if (this.dropCooldown <= 0) {
      this.dropCooldown = 1.4 + Math.random() * 0.8;
      onDropBomb(new Bomb(this.x, this.y + 12, this.dir * 20, 0, "HeavyBomb", 35));
    }
    if ((this.dir === 1 && this.x > 1050) || (this.dir === -1 && this.x < -90)) {
      this.isAlive = false;
    }
  }
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    if (this.dir === -1) ctx.scale(-1, 1);
    ctx.fillStyle = "#2e7d32";
    ctx.fillRect(-28, -8, 56, 16);
    ctx.fillStyle = "#1b5e20";
    ctx.fillRect(-10, -22, 20, 44);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(20, -4, 6, 8);
    ctx.restore();
  }
}

class AttackHelicopter extends EnemyPlaneBase {
  constructor(y) {
    super(0, y, 110, 45, 200);
    this.rotor = 0;
    this.rocketCooldown = 1.5;
  }
  update(dt, onDropBomb) {
    this.x += this.dir * this.speed * dt;
    this.rotor += dt * 30;
    this.rocketCooldown -= dt;
    if (this.rocketCooldown <= 0) {
      this.rocketCooldown = 2.0;
      onDropBomb(new Bomb(this.x, this.y + 10, this.dir * 30, 40, "GuidedRocket", 24));
    }
    if ((this.dir === 1 && this.x > 1050) || (this.dir === -1 && this.x < -90)) {
      this.isAlive = false;
    }
  }
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    if (this.dir === -1) ctx.scale(-1, 1);
    // Rotor
    ctx.strokeStyle = "rgba(255, 255, 255, 0.7)";
    ctx.lineWidth = 3;
    const rx = Math.cos(this.rotor) * 28;
    ctx.beginPath();
    ctx.moveTo(-rx, -14);
    ctx.lineTo(rx, -14);
    ctx.stroke();
    // Body
    ctx.fillStyle = "#455a64";
    ctx.beginPath();
    ctx.ellipse(0, 0, 20, 10, 0, 0, Math.PI * 2);
    ctx.fill();
    // Tail
    ctx.fillRect(-32, -3, 16, 5);
    ctx.restore();
  }
}

class BossGunship extends EnemyPlaneBase {
  constructor(y) {
    super(0, y, 65, 350, 1000);
    this.attackTimer = 0.5;
  }
  update(dt, onDropBomb) {
    this.x += this.dir * this.speed * dt;
    this.attackTimer -= dt;
    if (this.attackTimer <= 0) {
      this.attackTimer = 0.8;
      onDropBomb(new Bomb(this.x - 20, this.y + 16, -50, 60, "HeavyBomb", 35));
      onDropBomb(new Bomb(this.x + 20, this.y + 16, 50, 60, "HeavyBomb", 35));
    }
    if ((this.dir === 1 && this.x > 1150) || (this.dir === -1 && this.x < -150)) {
      this.isAlive = false;
    }
  }
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    if (this.dir === -1) ctx.scale(-1, 1);
    // Heavy Fortress Body
    ctx.fillStyle = "#b71c1c";
    ctx.fillRect(-60, -18, 120, 36);
    ctx.fillStyle = "#d32f2f";
    ctx.beginPath();
    ctx.moveTo(60, 0);
    ctx.lineTo(85, 0);
    ctx.lineTo(60, -14);
    ctx.closePath();
    ctx.fill();
    // Health bar above boss
    const hpPct = Math.max(0, this.health / this.maxHealth);
    ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
    ctx.fillRect(-50, -32, 100, 8);
    ctx.fillStyle = "#ff1744";
    ctx.fillRect(-50, -32, 100 * hpPct, 8);
    ctx.restore();
  }
}

class ParticleSystem {
  constructor() {
    this.particles = [];
  }
  emit(x, y, count, color = "#ff9100") {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 40 + Math.random() * 180;
      this.particles.push({
        x: x,
        y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 0.3 + Math.random() * 0.4,
        maxLife: 0.6,
        color: color,
        size: 2 + Math.random() * 4
      });
    }
  }
  update(dt) {
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      if (p.life <= 0) {
        this.particles.splice(i, 1);
      }
    }
  }
  draw(ctx) {
    ctx.save();
    for (const p of this.particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    }
    ctx.restore();
  }
}

// ==========================================
// 6. GAME RUNNER & STATE MACHINE
// ==========================================

const GameState = {
  LOADING: 0,
  MENU: 1,
  HOW_TO: 2,
  PLAYING: 3,
  GAME_OVER: 4,
  REPLAY_THEATER: 5
};

class GameRunner {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.state = GameState.LOADING;
    this.loadProgress = 0;

    this.mouse = { x: 480, y: 270, isDown: false, rightDown: false };
    this.keys = {};
    this.hudLog = [];

    // Entities
    this.player = null;
    this.ghostTank = null;
    this.recorder = new CommandRecorder();
    this.playbackEngine = new GhostPlaybackEngine();
    this.particles = new ParticleSystem();

    this.projectiles = [];
    this.bombs = [];
    this.enemies = [];
    this.supplyDrops = [];

    this.survivalTime = 0;
    this.score = 0;
    this.planesDestroyed = 0;
    this.spawnTimer = 0;
    this.supplyTimer = 8;
    this.bossTimer = 50;

    this.lastTime = performance.now();
    this.searchlightAngle = 0;

    this.initEvents();
    requestAnimationFrame(t => this.loop(t));
  }

  initEvents() {
    window.addEventListener("keydown", e => {
      this.keys[e.code] = true;
      audio.init();

      if (this.state === GameState.LOADING) {
        if (e.code === "Space" || e.code === "Enter") this.state = GameState.MENU;
      } else if (this.state === GameState.MENU) {
        if (e.code === "Digit1" || e.code === "Numpad1" || e.code === "Space" || e.code === "Enter") this.startMission();
        if (e.code === "Digit2" || e.code === "Numpad2") this.state = GameState.HOW_TO;
        if (e.code === "Digit3" || e.code === "Numpad3") this.startReplay();
      } else if (this.state === GameState.HOW_TO) {
        if (e.code === "Escape" || e.code === "KeyM" || e.code === "Space") this.state = GameState.MENU;
      } else if (this.state === GameState.PLAYING) {
        if (e.code === "Escape" || e.code === "KeyM") this.state = GameState.MENU;
        if (e.code === "KeyB" || e.code === "KeyF") {
          const cmd = new DeployNukeCommand();
          this.executeCommand(cmd, this.player);
        }
      } else if (this.state === GameState.GAME_OVER) {
        if (e.code === "KeyP") this.startReplay();
        if (e.code === "Space" || e.code === "Enter") this.startMission();
        if (e.code === "KeyM" || e.code === "Escape") this.state = GameState.MENU;
      } else if (this.state === GameState.REPLAY_THEATER) {
        if (e.code === "Escape" || e.code === "KeyM") this.state = GameState.MENU;
      }
    });

    window.addEventListener("keyup", e => {
      this.keys[e.code] = false;
    });

    this.canvas.addEventListener("mousemove", e => {
      const rect = this.canvas.getBoundingClientRect();
      this.mouse.x = (e.clientX - rect.left) * (this.canvas.width / rect.width);
      this.mouse.y = (e.clientY - rect.top) * (this.canvas.height / rect.height);
    });

    this.canvas.addEventListener("mousedown", e => {
      audio.init();
      if (e.button === 0) this.mouse.isDown = true;
      if (e.button === 2) {
        e.preventDefault();
        this.mouse.rightDown = true;
        if (this.state === GameState.PLAYING) {
          const cmd = new DeployNukeCommand();
          this.executeCommand(cmd, this.player);
        }
      }
      this.handleCanvasClick();
    });

    window.addEventListener("mouseup", e => {
      if (e.button === 0) this.mouse.isDown = false;
      if (e.button === 2) this.mouse.rightDown = false;
    });

    this.canvas.addEventListener("contextmenu", e => e.preventDefault());
  }

  handleCanvasClick() {
    if (this.state === GameState.LOADING) {
      this.state = GameState.MENU;
    } else if (this.state === GameState.MENU) {
      const my = this.mouse.y;
      if (my >= 250 && my <= 290) this.startMission();
      else if (my >= 300 && my <= 340) this.state = GameState.HOW_TO;
      else if (my >= 350 && my <= 390) this.startReplay();
    } else if (this.state === GameState.HOW_TO) {
      if (this.mouse.y > 450) this.state = GameState.MENU;
    } else if (this.state === GameState.GAME_OVER) {
      if (this.mouse.x < 480) this.startReplay();
      else this.startMission();
    }
  }

  startMission() {
    this.player = new PlayerTank(480, 480, 
      tank => this.spawnPlayerBullet(tank),
      tank => this.triggerNuke()
    );
    this.projectiles = [];
    this.bombs = [];
    this.enemies = [];
    this.supplyDrops = [];
    this.survivalTime = 0;
    this.score = 0;
    this.planesDestroyed = 0;
    this.spawnTimer = 1.0;
    this.bossTimer = 50;

    this.recorder.start();
    this.state = GameState.PLAYING;
  }

  startReplay() {
    if (this.recorder.history.length === 0) return;
    this.ghostTank = new GhostTank(480, 480,
      tank => this.spawnPlayerBullet(tank),
      tank => this.triggerNuke()
    );
    this.playbackEngine.load(this.recorder.history);
    this.projectiles = [];
    this.bombs = [];
    this.enemies = [];
    this.supplyDrops = [];
    this.replayTime = 0;
    this.state = GameState.REPLAY_THEATER;
  }

  executeCommand(cmd, target) {
    cmd.execute(target);
    this.recorder.record(cmd, this.survivalTime);
    this.hudLog.push(cmd.name);
    if (this.hudLog.length > 5) this.hudLog.shift();
  }

  spawnPlayerBullet(tank) {
    audio.playCannon();
    const rad = (tank.turretAngleDeg * Math.PI) / 180;
    const bx = tank.position.x + Math.cos(rad) * 40;
    const by = tank.position.y - 12 + Math.sin(rad) * 40;
    const speed = 750;
    this.projectiles.push(new Projectile(bx, by, Math.cos(rad) * speed, Math.sin(rad) * speed));
    this.particles.emit(bx, by, 6, "#ffca28");
  }

  triggerNuke() {
    audio.playNuke();
    this.particles.emit(480, 270, 80, "#00e5ff");
    this.bombs = [];
    for (const enemy of this.enemies) {
      this.score += enemy.scoreValue;
      this.planesDestroyed++;
      this.particles.emit(enemy.x, enemy.y, 25, "#ff5722");
    }
    this.enemies = [];
  }

  loop(timestamp) {
    const dt = Math.min((timestamp - this.lastTime) / 1000, 0.1);
    this.lastTime = timestamp;

    this.update(dt);
    this.draw();

    requestAnimationFrame(t => this.loop(t));
  }

  update(dt) {
    this.searchlightAngle += dt * 0.8;
    this.particles.update(dt);

    if (this.state === GameState.LOADING) {
      this.loadProgress += dt * 70;
      if (this.loadProgress >= 100) {
        this.loadProgress = 100;
        this.state = GameState.MENU;
      }
    } else if (this.state === GameState.PLAYING) {
      this.survivalTime += dt;
      this.handlePlayerInput(dt);
      this.updateSurvivalSpawns(dt);
      this.updateCombat(dt, this.player);

      if (!this.player.isAlive) {
        this.recorder.stop();
        this.state = GameState.GAME_OVER;
      }
    } else if (this.state === GameState.REPLAY_THEATER) {
      this.replayTime += dt;
      this.playbackEngine.update(this.replayTime, this.ghostTank);
      this.ghostTank.update(dt, 40, 920);

      for (let i = this.projectiles.length - 1; i >= 0; i--) {
        const p = this.projectiles[i];
        p.update(dt);
        if (!p.isAlive) this.projectiles.splice(i, 1);
      }

      if (!this.playbackEngine.isPlaying && this.replayTime > this.playbackEngine.totalDuration + 1.0) {
        this.state = GameState.MENU;
      }
    }
  }

  handlePlayerInput(dt) {
    let moveDir = 0;
    if (this.keys["KeyA"] || this.keys["ArrowLeft"]) moveDir -= 1;
    if (this.keys["KeyD"] || this.keys["ArrowRight"]) moveDir += 1;
    if (moveDir !== 0) {
      this.executeCommand(new MoveTankCommand(moveDir), this.player);
    }
    this.player.update(dt, 40, 920);

    // Turret Aim Command
    const dx = this.mouse.x - this.player.position.x;
    const dy = this.mouse.y - (this.player.position.y - 12);
    let angleDeg = (Math.atan2(dy, dx) * 180) / Math.PI;
    if (angleDeg > -10) angleDeg = -10;
    if (angleDeg < -170) angleDeg = -170;
    this.executeCommand(new AimTurretCommand(angleDeg), this.player);

    // Fire Command
    if (this.mouse.isDown || this.keys["Space"]) {
      this.executeCommand(new FireCannonCommand(), this.player);
    }
  }

  updateSurvivalSpawns(dt) {
    this.spawnTimer -= dt;
    this.supplyTimer -= dt;
    this.bossTimer -= dt;

    const spawnInterval = Math.max(0.4, 2.2 - this.survivalTime * 0.025);
    if (this.spawnTimer <= 0) {
      this.spawnTimer = spawnInterval;
      const roll = Math.random();
      const altitude = 80 + Math.random() * 200;

      if (this.survivalTime > 40 && roll < 0.28) {
        this.enemies.push(new AttackHelicopter(altitude));
      } else if (this.survivalTime > 15 && roll < 0.6) {
        this.enemies.push(new BomberPlane(altitude));
      } else {
        this.enemies.push(new FighterJet(altitude));
      }
    }

    if (this.bossTimer <= 0) {
      this.bossTimer = 55;
      this.enemies.push(new BossGunship(100));
    }

    if (this.supplyTimer <= 0) {
      this.supplyTimer = 14 + Math.random() * 8;
      const type = Math.random() < 0.65 ? "Health" : "Nuke";
      this.supplyDrops.push(new SupplyDrop(80 + Math.random() * 800, -20, type));
    }
  }

  updateCombat(dt, tank) {
    // Update enemies
    for (let i = this.enemies.length - 1; i >= 0; i--) {
      const e = this.enemies[i];
      e.update(dt, bomb => this.bombs.push(bomb));
      if (!e.isAlive) this.enemies.splice(i, 1);
    }

    // Update projectiles & collisions with enemies
    for (let i = this.projectiles.length - 1; i >= 0; i--) {
      const p = this.projectiles[i];
      p.update(dt);

      for (let j = this.enemies.length - 1; j >= 0; j--) {
        const e = this.enemies[j];
        if (Math.abs(p.x - e.x) < 35 && Math.abs(p.y - e.y) < 25) {
          p.isAlive = false;
          this.particles.emit(p.x, p.y, 8, "#ffeb3b");
          if (e.takeDamage(35)) {
            this.score += e.scoreValue;
            this.planesDestroyed++;
            this.particles.emit(e.x, e.y, 20, "#ff5722");
          }
          break;
        }
      }

      if (!p.isAlive) this.projectiles.splice(i, 1);
    }

    // Update bombs & collisions with tank
    const tb = tank.bounds;
    for (let i = this.bombs.length - 1; i >= 0; i--) {
      const b = this.bombs[i];
      b.update(dt, tank.position.x);

      // Check hit tank
      if (b.x >= tb.x && b.x <= tb.x + tb.w && b.y >= tb.y && b.y <= tb.y + tb.h) {
        b.isAlive = false;
        tank.takeDamage(b.damage);
        this.particles.emit(b.x, b.y, 16, "#ff1744");
      }

      if (!b.isAlive) {
        this.particles.emit(b.x, b.y, 6, "#ff9100");
        this.bombs.splice(i, 1);
      }
    }

    // Update supply drops
    for (let i = this.supplyDrops.length - 1; i >= 0; i--) {
      const s = this.supplyDrops[i];
      s.update(dt);
      if (Math.abs(s.x - tank.position.x) < 38 && Math.abs(s.y - tank.position.y) < 30) {
        if (s.type === "Health") {
          tank.health = Math.min(tank.maxHealth, tank.health + 35);
        } else {
          tank.nukeCount++;
        }
        audio.playSupply();
        this.particles.emit(s.x, s.y, 14, "#00e676");
        this.supplyDrops.splice(i, 1);
      }
    }
  }

  draw() {
    const ctx = this.ctx;
    ctx.clearRect(0, 0, 960, 540);

    // Sky Background
    ctx.fillStyle = "#0a0e17";
    ctx.fillRect(0, 0, 960, 540);

    // Searchlights
    ctx.save();
    const l1 = Math.sin(this.searchlightAngle) * 220;
    const l2 = Math.cos(this.searchlightAngle * 0.8) * 240;
    this.drawSearchlight(ctx, 240, 500, 240 + l1, 0);
    this.drawSearchlight(ctx, 720, 500, 720 + l2, 0);
    ctx.restore();

    // Ground
    ctx.fillStyle = "#1b2a1e";
    ctx.fillRect(0, 490, 960, 50);
    ctx.fillStyle = "#2e7d32";
    ctx.fillRect(0, 488, 960, 4);

    if (this.state === GameState.LOADING) {
      this.drawLoading(ctx);
    } else if (this.state === GameState.MENU) {
      this.drawMainMenu(ctx);
    } else if (this.state === GameState.HOW_TO) {
      this.drawHowTo(ctx);
    } else if (this.state === GameState.PLAYING) {
      this.drawCombat(ctx, this.player);
      this.drawHUD(ctx);
    } else if (this.state === GameState.GAME_OVER) {
      this.drawCombat(ctx, this.player);
      this.drawGameOver(ctx);
    } else if (this.state === GameState.REPLAY_THEATER) {
      this.drawCombat(ctx, this.ghostTank);
      this.drawReplayBar(ctx);
    }

    this.particles.draw(ctx);
  }

  drawSearchlight(ctx, bx, by, tx, ty) {
    const grad = ctx.createRadialGradient(bx, by, 10, tx, ty, 300);
    grad.addColorStop(0, "rgba(255, 255, 200, 0.22)");
    grad.addColorStop(1, "rgba(255, 255, 200, 0.0)");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(bx - 12, by);
    ctx.lineTo(tx - 70, ty);
    ctx.lineTo(tx + 70, ty);
    ctx.lineTo(bx + 12, by);
    ctx.closePath();
    ctx.fill();
  }

  drawCombat(ctx, tank) {
    for (const s of this.supplyDrops) s.draw(ctx);
    for (const e of this.enemies) e.draw(ctx);
    for (const b of this.bombs) b.draw(ctx);
    for (const p of this.projectiles) p.draw(ctx);
    if (tank) tank.draw(ctx);
  }

  drawHUD(ctx) {
    // Health Bar
    ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
    ctx.fillRect(20, 16, 204, 22);
    const hpPct = Math.max(0, this.player.health / this.player.maxHealth);
    ctx.fillStyle = hpPct > 0.3 ? "#4caf50" : "#f44336";
    ctx.fillRect(22, 18, 200 * hpPct, 18);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 12px sans-serif";
    ctx.fillText(`ARMOR HP: ${Math.round(this.player.health)}%`, 30, 32);

    // Nukes
    ctx.fillStyle = "#ffd600";
    ctx.font = "bold 13px sans-serif";
    ctx.fillText(`NUKE CHARGES: ${"☢ ".repeat(this.player.nukeCount)}`, 20, 58);

    // Score & Survival Time
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 15px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(`SURVIVED: ${this.survivalTime.toFixed(1)}s   |   SCORE: ${this.score}   |   KILLS: ${this.planesDestroyed}`, 480, 30);
    ctx.textAlign = "left";

    // Command Log HUD (GoF Command Pattern Live Feed)
    ctx.fillStyle = "rgba(10, 20, 30, 0.75)";
    ctx.fillRect(720, 14, 220, 120);
    ctx.strokeStyle = "#00e5ff";
    ctx.lineWidth = 1;
    ctx.strokeRect(720, 14, 220, 120);
    ctx.fillStyle = "#00e5ff";
    ctx.font = "bold 11px monospace";
    ctx.fillText("📡 COMMAND PATTERN STREAM", 730, 30);
    ctx.fillStyle = "rgba(255, 255, 255, 0.75)";
    let ly = 48;
    for (const log of this.hudLog) {
      ctx.fillText(`> ${log}`, 730, ly);
      ly += 16;
    }
  }

  drawLoading(ctx) {
    ctx.fillStyle = "#00e5ff";
    ctx.font = "bold 32px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("SKYBREAKER", 480, 220);
    ctx.font = "14px sans-serif";
    ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
    ctx.fillText("Compiling GoF Command Pattern & Replay Engine...", 480, 260);

    // Bar
    ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
    ctx.fillRect(280, 290, 400, 18);
    ctx.fillStyle = "#00e5ff";
    ctx.fillRect(280, 290, 400 * (this.loadProgress / 100), 18);
    ctx.fillStyle = "#ffffff";
    ctx.font = "12px sans-serif";
    ctx.fillText(`${Math.round(this.loadProgress)}% (Press SPACE to Skip)`, 480, 335);
    ctx.textAlign = "left";
  }

  drawMainMenu(ctx) {
    ctx.fillStyle = "#00e5ff";
    ctx.font = "bold 44px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("SKYBREAKER", 480, 150);
    ctx.font = "14px sans-serif";
    ctx.fillStyle = "#ffca28";
    ctx.fillText("ENDLESS AIR RAID SURVIVAL & GOF COMMAND REPLAY", 480, 185);

    // Menu Buttons
    const opts = [
      { t: "[1] START MISSION", y: 250 },
      { t: "[2] HOW TO PLAY", y: 300 },
      { t: `[3] REPLAY THEATER ${this.recorder.history.length ? "(READY)" : "(PLAY FIRST)"}`, y: 350 }
    ];
    for (const opt of opts) {
      const isHover = this.mouse.y >= opt.y && this.mouse.y <= opt.y + 40 && this.mouse.x >= 320 && this.mouse.x <= 640;
      ctx.fillStyle = isHover ? "rgba(0, 229, 255, 0.3)" : "rgba(10, 25, 40, 0.7)";
      ctx.fillRect(320, opt.y, 320, 38);
      ctx.strokeStyle = isHover ? "#00e5ff" : "rgba(0, 229, 255, 0.3)";
      ctx.strokeRect(320, opt.y, 320, 38);
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 15px sans-serif";
      ctx.fillText(opt.t, 480, opt.y + 24);
    }
    ctx.textAlign = "left";
  }

  drawHowTo(ctx) {
    ctx.fillStyle = "rgba(10, 16, 26, 0.95)";
    ctx.fillRect(80, 40, 800, 460);
    ctx.strokeStyle = "#00e5ff";
    ctx.strokeRect(80, 40, 800, 460);

    ctx.fillStyle = "#00e5ff";
    ctx.font = "bold 22px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("ยุทธวิธีการรบ & ระบบควบคุม (HOW TO PLAY)", 480, 80);

    ctx.textAlign = "left";
    ctx.font = "14px sans-serif";
    ctx.fillStyle = "#ffffff";
    const lines = [
      "• [A] / [D] หรือ [←] / [→] : ขับเคลื่อนรถถังซ้าย-ขวาตามแนวพื้นดิน",
      "• [Mouse Aim] : หันเล็งองศาป้อมปืนใหญ่ขึ้นฟ้าตามเคอร์เซอร์",
      "• [Space] หรือ [คลิกซ้าย] : ยิงกระสุนปืนใหญ่สกัดฝูงบินข้าศึก",
      "• [คลิกขวา] หรือ [B / F] : ปล่อยระเบิดนิวเคลียร์ล้างจอ (Deploy Nuke Command)",
      "• ระวังลูกระเบิดสีแดง 35 DMG จากเครื่องบินทิ้งระเบิด และจรวดมิสไซล์นำวิถี",
      "• ขับรถถังไปเก็บกล่องพยาบาล (+) เพื่อเพิ่มเลือด 35 HP และกล่องนิวเคลียร์ (☢)",
      "• เมื่อแพ้ สามารถกด [P] เพื่อเข้าสู่ Replay Theater จำลองการเล่นด้วย GoF Command Pattern"
    ];
    let y = 130;
    for (const l of lines) {
      ctx.fillText(l, 120, y);
      y += 34;
    }

    ctx.fillStyle = "#ffca28";
    ctx.textAlign = "center";
    ctx.fillText("คลิกเมาส์ หรือกด [ESC] เพื่อกลับสู่หน้าเมนูหลัก", 480, 470);
    ctx.textAlign = "left";
  }

  drawGameOver(ctx) {
    ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
    ctx.fillRect(200, 120, 560, 300);
    ctx.strokeStyle = "#f44336";
    ctx.lineWidth = 2;
    ctx.strokeRect(200, 120, 560, 300);

    ctx.fillStyle = "#f44336";
    ctx.font = "bold 34px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("TANK DESTROYED", 480, 180);

    ctx.fillStyle = "#ffffff";
    ctx.font = "16px sans-serif";
    ctx.fillText(`รอดชีวิต: ${this.survivalTime.toFixed(1)} วินาที  |  คะแนน: ${this.score}`, 480, 230);
    ctx.fillText(`ทำลายเครื่องบิน: ${this.planesDestroyed} ลำ  |  คำสั่งที่บันทึก: ${this.recorder.history.length} Commands`, 480, 265);

    // Actions
    ctx.fillStyle = "#00e5ff";
    ctx.font = "bold 16px sans-serif";
    ctx.fillText("กด [P] รับชม REPLAY THEATER  |  กด [SPACE] เริ่มใหม่", 480, 340);
    ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
    ctx.font = "13px sans-serif";
    ctx.fillText("กด [M] หรือ [ESC] กลับเมนูหลัก", 480, 380);
    ctx.textAlign = "left";
  }

  drawReplayBar(ctx) {
    const total = this.playbackEngine.totalDuration || 1;
    const pct = Math.min(1.0, this.replayTime / total);

    ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
    ctx.fillRect(180, 14, 600, 34);
    ctx.strokeStyle = "#00e5ff";
    ctx.strokeRect(180, 14, 600, 34);

    ctx.fillStyle = "#00e5ff";
    ctx.fillRect(182, 16, 596 * pct, 30);

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 13px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(`🎞️ REPLAY THEATER: ${this.replayTime.toFixed(1)}s / ${total.toFixed(1)}s (กด ESC เพื่อออก)`, 480, 36);
    ctx.textAlign = "left";
  }
}

// Start Game
window.addEventListener("DOMContentLoaded", () => {
  const canvas = document.getElementById("gameCanvas");
  new GameRunner(canvas);
});
</script>
