<script>
/**
 * ============================================================================
 * 🚀 SKYBREAKER (Heavy Weapons) - 1:1 Pixel-Perfect WebGL / Canvas Edition
 * Architecture: GoF Command Pattern, Stream Recording, and Ghost Replay Theater
 * Designed to exactly mirror the C# Raylib-cs Desktop Windows Architecture
 * ============================================================================
 */

// Canvas roundRect Polyfill for universal browser compatibility
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    if (typeof r === 'undefined') r = 5;
    if (typeof r === 'number') r = { tl: r, tr: r, br: r, bl: r };
    this.beginPath();
    this.moveTo(x + (r.tl || 0), y);
    this.lineTo(x + w - (r.tr || 0), y);
    this.quadraticCurveTo(x + w, y, x + w, y + (r.tr || 0));
    this.lineTo(x + w, y + h - (r.br || 0));
    this.quadraticCurveTo(x + w, y + h, x + w - (r.br || 0), y + h);
    this.lineTo(x + (r.bl || 0), y + h);
    this.quadraticCurveTo(x, y + h, x, y + h - (r.bl || 0));
    this.lineTo(x, y + (r.tl || 0));
    this.quadraticCurveTo(x, y, x + (r.tl || 0), y);
    this.closePath();
    return this;
  };
}

// ----------------------------------------------------------------------------
// SOUND SYNTHESIZER (Web Audio API)
// ----------------------------------------------------------------------------
class SoundSystem {
  constructor() {
    this.ctx = null;
  }
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }
  playCannon() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(220, t);
    osc.frequency.exponentialRampToValueAtTime(32, t + 0.16);
    gain.gain.setValueAtTime(0.35, t);
    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.16);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(t);
    osc.stop(t + 0.16);
  }
  playExplosion() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(120, t);
    osc.frequency.exponentialRampToValueAtTime(24, t + 0.32);
    gain.gain.setValueAtTime(0.4, t);
    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.32);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(t);
    osc.stop(t + 0.32);
  }
  playSupply() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(523.25, t); // C5
    osc.frequency.setValueAtTime(659.25, t + 0.08); // E5
    osc.frequency.setValueAtTime(783.99, t + 0.16); // G5
    gain.gain.setValueAtTime(0.3, t);
    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.35);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(t);
    osc.stop(t + 0.35);
  }
  playHit() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(150, t);
    osc.frequency.exponentialRampToValueAtTime(45, t + 0.09);
    gain.gain.setValueAtTime(0.25, t);
    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.09);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(t);
    osc.stop(t + 0.09);
  }
}
const sfx = new SoundSystem();

// ----------------------------------------------------------------------------
// GOF COMMAND PATTERN INTERFACES & COMMAND OBJECTS
// ----------------------------------------------------------------------------
class ICommand {
  constructor(name) {
    this.name = name;
  }
  execute(target) {
    throw new Error("Execute must be implemented");
  }
}

class MoveTankCommand extends ICommand {
  constructor(directionX) {
    super("MoveTankCommand");
    this.directionX = directionX;
  }
  execute(target) {
    target.move(this.directionX);
  }
}

class AimTurretCommand extends ICommand {
  constructor(angleDeg) {
    super("AimTurretCommand");
    this.angleDeg = angleDeg;
  }
  execute(target) {
    target.aimTurret(this.angleDeg);
  }
}

class FireCannonCommand extends ICommand {
  constructor() {
    super("FireCannonCommand");
  }
  execute(target) {
    target.fire();
  }
}

// ----------------------------------------------------------------------------
// RECEIVER HIERARCHY (ITankReceiver, TankBase, PlayerTank, GhostTank)
// ----------------------------------------------------------------------------
class ITankReceiver {
  move(dirX) {}
  aimTurret(angleDeg) {}
  fire() {}
  takeDamage(amt) {}
  reset(pos) {}
}

class TankBase extends ITankReceiver {
  constructor(name, startPos) {
    super();
    this.name = name;
    this.position = { x: startPos.x, y: startPos.y };
    this.velocity = { x: 0, y: 0 };
    this.turretAngleDeg = -90;
    this.health = 100;
    this.maxHealth = 100;

    this.moveSpeed = 280;
    this.chassisWidth = 68;
    this.chassisHeight = 22;
    this.barrelLength = 34;

    this.onFireAction = null;
  }

  get isAlive() {
    return this.health > 0;
  }

  get bounds() {
    return {
      x: this.position.x - this.chassisWidth / 2,
      y: this.position.y - this.chassisHeight - 12,
      width: this.chassisWidth,
      height: this.chassisHeight + 12
    };
  }

  get turretPivot() {
    return { x: this.position.x, y: this.position.y - this.chassisHeight - 2 };
  }

  get muzzleTip() {
    const rad = (this.turretAngleDeg * Math.PI) / 180;
    const pivot = this.turretPivot;
    return {
      x: pivot.x + Math.cos(rad) * this.barrelLength,
      y: pivot.y + Math.sin(rad) * this.barrelLength
    };
  }

  move(directionX) {
    this.velocity.x = directionX * this.moveSpeed;
  }

  aimTurret(angleDeg) {
    this.turretAngleDeg = angleDeg;
  }

  fire() {
    if (!this.isAlive) return;
    const isGhost = this instanceof GhostTank;
    if (this.onFireAction) {
      this.onFireAction(this.muzzleTip, this.turretAngleDeg, isGhost);
    }
  }

  takeDamage(damage) {
    this.health = Math.max(0, this.health - damage);
    sfx.playHit();
  }

  stop() {
    this.velocity.x = 0;
  }

  reset(startPos) {
    this.position.x = startPos.x;
    this.position.y = startPos.y;
    this.velocity.x = 0;
    this.turretAngleDeg = -90;
    this.health = this.maxHealth;
  }

  updatePhysics(dt, minX, maxX) {
    if (!this.isAlive) return;
    this.position.x += this.velocity.x * dt;
    this.position.x = Math.max(minX, Math.min(maxX, this.position.x));
  }

  draw(ctx, bodyColor, accentColor, barrelColor, alpha = 1.0) {
    if (!this.isAlive) return;

    ctx.save();
    ctx.globalAlpha = alpha;
    const pivot = this.turretPivot;
    const tip = this.muzzleTip;

    // 1. Cannon Barrel
    ctx.strokeStyle = barrelColor;
    ctx.lineWidth = 8;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(pivot.x, pivot.y);
    ctx.lineTo(tip.x, tip.y);
    ctx.stroke();

    // Muzzle tip circle
    ctx.fillStyle = barrelColor;
    ctx.beginPath();
    ctx.arc(tip.x, tip.y, 4.5, 0, Math.PI * 2);
    ctx.fill();

    // 2. Turret Dome
    ctx.fillStyle = bodyColor;
    ctx.beginPath();
    ctx.arc(pivot.x, pivot.y, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = accentColor;
    ctx.lineWidth = 2;
    ctx.stroke();

    // 3. Chassis Hull (Rounded Box)
    const hullX = this.position.x - this.chassisWidth / 2 + 4;
    const hullY = this.position.y - this.chassisHeight;
    const hullW = this.chassisWidth - 8;
    const hullH = this.chassisHeight - 6;

    ctx.fillStyle = bodyColor;
    ctx.beginPath();
    ctx.roundRect(hullX, hullY, hullW, hullH, 5);
    ctx.fill();
    ctx.strokeStyle = accentColor;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // 4. Treads
    const treadX = this.position.x - this.chassisWidth / 2;
    const treadY = this.position.y - 10;
    const treadW = this.chassisWidth;
    const treadH = 10;

    ctx.fillStyle = "rgba(30, 35, 42, 0.95)";
    ctx.beginPath();
    ctx.roundRect(treadX, treadY, treadW, treadH, 4);
    ctx.fill();
    ctx.strokeStyle = accentColor;
    ctx.lineWidth = 1.2;
    ctx.stroke();

    // 4 Road Wheels
    ctx.fillStyle = accentColor;
    for (let i = 0; i < 4; i++) {
      const wx = this.position.x - this.chassisWidth / 2 + 10 + i * 16;
      ctx.beginPath();
      ctx.arc(wx, this.position.y - 5, 4, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }
}

class PlayerTank extends TankBase {
  constructor(startPos) {
    super("PlayerTank", startPos);
  }
  draw(ctx) {
    // Military Olive Green (identical to C# Raylib)
    super.draw(ctx, "rgb(65, 120, 65)", "rgb(130, 200, 100)", "rgb(40, 75, 40)", 1.0);
  }
}

class GhostTank extends TankBase {
  constructor(startPos) {
    super("GhostTank", startPos);
    this.isActive = false;
    this.isTheaterMode = false;
  }
  takeDamage(damage) {} // Invulnerable in Replay Theater
  draw(ctx) {
    // Holographic Cyan (identical to C# Raylib)
    super.draw(ctx, "rgba(0, 180, 220, 0.75)", "rgb(100, 240, 255)", "rgb(0, 140, 180)", 0.88);
  }
}

// ----------------------------------------------------------------------------
// REPLAY SYSTEM (TimedCommand, CommandRecorder, GhostPlaybackEngine)
// ----------------------------------------------------------------------------
class TimedCommand {
  constructor(timestamp, command) {
    this.timestamp = timestamp;
    this.command = command;
  }
}

class CommandRecorder {
  constructor() {
    this.history = [];
    this.isRecording = false;
  }
  startRecording() {
    this.history = [];
    this.isRecording = true;
  }
  record(cmd, timestamp) {
    if (this.isRecording) {
      this.history.push(new TimedCommand(timestamp, cmd));
    }
  }
  stopRecording() {
    this.isRecording = false;
  }
  getTapeCopy() {
    return [...this.history];
  }
  get commandCount() {
    return this.history.length;
  }
}

class GhostPlaybackEngine {
  constructor() {
    this.queue = [];
    this.isPlaying = false;
  }
  startPlayback(commands) {
    this.queue = [...commands];
    this.isPlaying = true;
  }
  update(currentTime, target) {
    while (this.queue.length > 0 && this.queue[0].timestamp <= currentTime) {
      const tc = this.queue.shift();
      tc.command.execute(target);
    }
    if (this.queue.length === 0) {
      this.isPlaying = false;
    }
  }
  stopPlayback() {
    this.isPlaying = false;
    this.queue = [];
  }
}

// ----------------------------------------------------------------------------
// ENTITIES (Projectile, Bomb, SupplyDrop, Enemies, ParticleSystem)
// ----------------------------------------------------------------------------
class Projectile {
  constructor(startPos, angleDeg, speed, isGhost = false) {
    this.position = { x: startPos.x, y: startPos.y };
    const rad = (angleDeg * Math.PI) / 180;
    this.velocity = { x: Math.cos(rad) * speed, y: Math.sin(rad) * speed };
    this.isGhost = isGhost;
    this.isActive = true;
    this.radius = 4;
  }
  update(dt) {
    this.position.x += this.velocity.x * dt;
    this.position.y += this.velocity.y * dt;
    if (this.position.x < -40 || this.position.x > 1320 || this.position.y < -40 || this.position.y > 760) {
      this.isActive = false;
    }
  }
  draw(ctx) {
    ctx.save();
    ctx.fillStyle = this.isGhost ? "rgb(0, 220, 255)" : "rgb(255, 230, 80)";
    ctx.beginPath();
    ctx.arc(this.position.x, this.position.y, this.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

class Bomb {
  constructor(startPos, vel, type = "HeavyBomb") {
    this.position = { x: startPos.x, y: startPos.y };
    this.velocity = { x: vel.x, y: vel.y };
    this.type = type; // "MachineGunBullet", "HeavyBomb", "GuidedRocket"
    this.isActive = true;

    if (type === "HeavyBomb") this.damage = 35;
    else if (type === "GuidedRocket") this.damage = 24;
    else this.damage = 12;
  }
  update(dt, groundY, playerX) {
    if (this.type === "HeavyBomb") {
      this.velocity.y += 280 * dt; // gravity
    } else if (this.type === "GuidedRocket") {
      const dx = playerX - this.position.x;
      this.velocity.x += Math.sign(dx) * 160 * dt;
      this.velocity.y += 180 * dt;
    }

    this.position.x += this.velocity.x * dt;
    this.position.y += this.velocity.y * dt;

    if (this.position.y >= groundY - 2) {
      this.isActive = false;
    }
  }
  draw(ctx) {
    ctx.save();
    const x = this.position.x;
    const y = this.position.y;

    if (this.type === "HeavyBomb") {
      // Devastating Red Heavy Bomb (35 DMG)
      ctx.fillStyle = "rgb(230, 30, 40)";
      ctx.beginPath();
      ctx.ellipse(x, y, 6, 10, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "rgb(20, 20, 25)";
      ctx.fillRect(x - 5, y - 10, 10, 4);
    } else if (this.type === "GuidedRocket") {
      ctx.fillStyle = "rgb(255, 140, 0)";
      ctx.fillRect(x - 3, y - 8, 6, 16);
      ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
      ctx.beginPath();
      ctx.arc(x, y - 10, 3.5, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // Machine gun laser bullet
      ctx.fillStyle = "rgb(255, 50, 70)";
      ctx.fillRect(x - 2, y - 6, 4, 12);
    }
    ctx.restore();
  }
}

class SupplyDrop {
  constructor(startPos, type = "ArmorRepair") {
    this.position = { x: startPos.x, y: startPos.y };
    this.type = "ArmorRepair";
    this.isActive = true;
    this.velocity = { x: 0, y: 70 };
  }
  update(dt, groundY) {
    this.position.y += this.velocity.y * dt;
    if (this.position.y >= groundY - 14) {
      this.position.y = groundY - 14;
    }
  }
  draw(ctx) {
    ctx.save();
    const x = this.position.x;
    const y = this.position.y;

    // Parachute (Green Medical Dome)
    if (y < 620) {
      ctx.fillStyle = "rgba(46, 204, 113, 0.9)";
      ctx.beginPath();
      ctx.arc(x, y - 18, 16, Math.PI, 0);
      ctx.fill();
      ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(x - 16, y - 18);
      ctx.lineTo(x - 8, y);
      ctx.moveTo(x + 16, y - 18);
      ctx.lineTo(x + 8, y);
      ctx.stroke();
    }

    // Medical Armor Repair Crate (Green + White Plus)
    ctx.fillStyle = "rgb(35, 75, 45)";
    ctx.fillRect(x - 12, y - 12, 24, 20);
    ctx.strokeStyle = "rgb(0, 230, 100)";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(x - 12, y - 12, 24, 20);

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 15px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("+", x, y - 2);
    ctx.restore();
  }
}

// Enemy Base & Types (Polymorphism)
class EnemyPlaneBase {
  constructor(name, startPos, vel, health, scoreValue) {
    this.name = name;
    this.position = { x: startPos.x, y: startPos.y };
    this.velocity = { x: vel.x, y: vel.y };
    this.health = health;
    this.maxHealth = health;
    this.scoreValue = scoreValue;
    this.isActive = true;
    this.isBoss = false;
  }
  get isDestroyed() {
    return this.health <= 0;
  }
  takeDamage(dmg) {
    this.health = Math.max(0, this.health - dmg);
  }
}

class FighterJet extends EnemyPlaneBase {
  constructor(startPos, flyRight) {
    super("Fighter Jet", startPos, { x: flyRight ? 290 : -290, y: 0 }, 40, 100);
    this.facingRight = flyRight;
    this.strafeCooldown = 0.5;
    this.afterburner = 0;
  }
  update(dt, playerPos, onSpawnAttack) {
    this.position.x += this.velocity.x * dt;
    this.afterburner += dt * 30;
    this.strafeCooldown -= dt;

    if (this.strafeCooldown <= 0 && this.position.x > 80 && this.position.x < 1200) {
      this.strafeCooldown = 0.8;
      const dx = playerPos.x - this.position.x;
      const dy = playerPos.y - this.position.y;
      const len = Math.hypot(dx, dy) || 1;
      const bulletVel = { x: (dx / len) * 350, y: (dy / len) * 350 };
      onSpawnAttack(this.position, bulletVel, "MachineGunBullet");
    }

    if (this.position.x < -140 || this.position.x > 1420) {
      this.isActive = false;
    }
  }
  draw(ctx) {
    ctx.save();
    const x = this.position.x;
    const y = this.position.y;
    const dir = this.facingRight ? 1 : -1;

    // Afterburner Flame
    ctx.strokeStyle = Math.sin(this.afterburner) > 0 ? "rgb(255, 215, 0)" : "rgb(255, 120, 0)";
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(x - dir * 26, y);
    ctx.lineTo(x - dir * 42, y);
    ctx.stroke();

    // Delta Wings
    const nose = { x: x + dir * 28, y: y };
    const wingTop = { x: x - dir * 8, y: y - 14 };
    const wingBottom = { x: x - dir * 8, y: y + 14 };
    const tail = { x: x - dir * 24, y: y };

    ctx.fillStyle = "rgb(50, 70, 95)";
    ctx.beginPath();
    ctx.moveTo(nose.x, nose.y);
    ctx.lineTo(wingTop.x, wingTop.y);
    ctx.lineTo(tail.x, tail.y);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "rgb(40, 55, 75)";
    ctx.beginPath();
    ctx.moveTo(nose.x, nose.y);
    ctx.lineTo(tail.x, tail.y);
    ctx.lineTo(wingBottom.x, wingBottom.y);
    ctx.closePath();
    ctx.fill();

    // Fuselage & Cockpit
    ctx.strokeStyle = "rgb(180, 195, 215)";
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(tail.x, tail.y);
    ctx.lineTo(nose.x, nose.y);
    ctx.stroke();

    ctx.fillStyle = "rgb(135, 206, 235)";
    ctx.beginPath();
    ctx.arc(x + dir * 6, y - 2, 4, 0, Math.PI * 2);
    ctx.fill();

    // Red Tail Fin
    ctx.fillStyle = "rgb(220, 40, 40)";
    ctx.beginPath();
    ctx.moveTo(tail.x, tail.y);
    ctx.lineTo(tail.x - dir * 4, tail.y - 12);
    ctx.lineTo(tail.x + dir * 8, tail.y);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }
}

class BomberPlane extends EnemyPlaneBase {
  constructor(startPos, flyRight) {
    super("Heavy Bomber", startPos, { x: flyRight ? 135 : -135, y: 0 }, 80, 250);
    this.facingRight = flyRight;
    this.bombTimer = 0.8;
  }
  update(dt, playerPos, onSpawnAttack) {
    this.position.x += this.velocity.x * dt;
    this.bombTimer -= dt;

    if (this.bombTimer <= 0 && this.position.x > 80 && this.position.x < 1200) {
      this.bombTimer = 1.6;
      const bombBay = { x: this.position.x, y: this.position.y + 14 };
      const bombVel = { x: this.velocity.x * 0.35, y: 60 };
      onSpawnAttack(bombBay, bombVel, "HeavyBomb");
    }

    if (this.position.x < -160 || this.position.x > 1440) {
      this.isActive = false;
    }
  }
  draw(ctx) {
    ctx.save();
    const x = this.position.x;
    const y = this.position.y;
    const dir = this.facingRight ? 1 : -1;

    // Heavy Fuselage
    ctx.fillStyle = "rgb(75, 85, 60)";
    ctx.beginPath();
    ctx.roundRect(x - 36, y - 8, 72, 16, 6);
    ctx.fill();
    ctx.strokeStyle = "rgb(45, 55, 35)";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Large Double Wings
    ctx.fillStyle = "rgb(90, 100, 75)";
    ctx.fillRect(x - dir * 4 - 10, y - 22, 20, 44);

    // Rounded Nose
    ctx.fillStyle = "rgb(60, 70, 50)";
    ctx.beginPath();
    ctx.arc(x + dir * 38, y, 7, 0, Math.PI * 2);
    ctx.fill();

    // Gold Cockpit Glass
    ctx.fillStyle = "rgb(255, 215, 0)";
    ctx.beginPath();
    ctx.arc(x + dir * 24, y - 4, 4.5, 0, Math.PI * 2);
    ctx.fill();

    // Bomber HP Bar
    const hpPct = Math.max(0, this.health / this.maxHealth);
    ctx.fillStyle = "rgb(60, 60, 60)";
    ctx.fillRect(x - 25, y - 26, 50, 4);
    ctx.fillStyle = "rgb(255, 140, 0)";
    ctx.fillRect(x - 25, y - 26, 50 * hpPct, 4);

    ctx.restore();
  }
}

class AttackHelicopter extends EnemyPlaneBase {
  constructor(startPos, flyRight) {
    super("Gunship Heli", startPos, { x: flyRight ? 170 : -170, y: 0 }, 50, 180);
    this.facingRight = flyRight;
    this.baseY = startPos.y;
    this.bobTimer = 0;
    this.rotorAngle = 0;
    this.rocketTimer = 1.0;
  }
  update(dt, playerPos, onSpawnAttack) {
    this.bobTimer += dt * 3.5;
    this.rotorAngle += dt * 1400;

    this.position.x += this.velocity.x * dt;
    this.position.y = this.baseY + Math.sin(this.bobTimer) * 22;

    this.rocketTimer -= dt;
    if (this.rocketTimer <= 0 && this.position.x > 100 && this.position.x < 1180) {
      this.rocketTimer = 2.0;
      const dx = playerPos.x - this.position.x;
      const dy = playerPos.y - (this.position.y + 12);
      const len = Math.hypot(dx, dy) || 1;
      const rocketVel = { x: (dx / len) * 280, y: (dy / len) * 280 };
      onSpawnAttack({ x: this.position.x, y: this.position.y + 12 }, rocketVel, "GuidedRocket");
    }

    if (this.position.x < -150 || this.position.x > 1430) {
      this.isActive = false;
    }
  }
  draw(ctx) {
    ctx.save();
    const x = this.position.x;
    const y = this.position.y;
    const dir = this.facingRight ? 1 : -1;

    // Spinning Rotor
    const rotorWidth = Math.cos((this.rotorAngle * Math.PI) / 180) * 36;
    ctx.strokeStyle = "rgb(20, 20, 20)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x, y - 6);
    ctx.lineTo(x, y - 14);
    ctx.stroke();

    ctx.strokeStyle = "rgba(220, 220, 220, 0.85)";
    ctx.beginPath();
    ctx.moveTo(x - rotorWidth, y - 14);
    ctx.lineTo(x + rotorWidth, y - 14);
    ctx.stroke();

    // Heli Body Pod
    ctx.fillStyle = "rgb(55, 65, 75)";
    ctx.beginPath();
    ctx.arc(x, y, 13, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgb(135, 206, 235)";
    ctx.lineWidth = 1.2;
    ctx.stroke();

    // Tail Boom
    ctx.strokeStyle = "rgb(45, 55, 65)";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x - dir * 28, y - 4);
    ctx.stroke();

    ctx.fillStyle = "rgb(220, 40, 40)";
    ctx.beginPath();
    ctx.arc(x - dir * 28, y - 4, 3.5, 0, Math.PI * 2);
    ctx.fill();

    // Gold Cockpit Glass
    ctx.fillStyle = "rgb(255, 215, 0)";
    ctx.beginPath();
    ctx.arc(x + dir * 6, y - 2, 5.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

class BossGunship extends EnemyPlaneBase {
  constructor(startPos) {
    super("Dreadnought Fortress", startPos, { x: 90, y: 0 }, 450, 2000);
    this.isBoss = true;
    this.strafeTimer = 0.5;
    this.bombTimer = 1.8;
    this.moveDirX = 1;
    this.flashTimer = 0;
  }
  takeDamage(dmg) {
    super.takeDamage(dmg);
    this.flashTimer = 0.08;
  }
  update(dt, playerPos, onSpawnAttack) {
    if (this.flashTimer > 0) this.flashTimer -= dt;

    this.position.x += this.moveDirX * 100 * dt;
    if (this.position.x > 1050) {
      this.position.x = 1050;
      this.moveDirX = -1;
    } else if (this.position.x < 230) {
      this.position.x = 230;
      this.moveDirX = 1;
    }

    // Dual laser guns
    this.strafeTimer -= dt;
    if (this.strafeTimer <= 0) {
      this.strafeTimer = 0.55;
      const leftWing = { x: this.position.x - 60, y: this.position.y + 10 };
      const rightWing = { x: this.position.x + 60, y: this.position.y + 10 };

      const dlx = playerPos.x - leftWing.x, dly = playerPos.y - leftWing.y;
      const lenL = Math.hypot(dlx, dly) || 1;
      onSpawnAttack(leftWing, { x: (dlx / lenL) * 320, y: (dly / lenL) * 320 }, "MachineGunBullet");

      const drx = playerPos.x - rightWing.x, dry = playerPos.y - rightWing.y;
      const lenR = Math.hypot(drx, dry) || 1;
      onSpawnAttack(rightWing, { x: (drx / lenR) * 320, y: (dry / lenR) * 320 }, "MachineGunBullet");
    }

    // Heavy bombs
    this.bombTimer -= dt;
    if (this.bombTimer <= 0) {
      this.bombTimer = 2.2;
      onSpawnAttack({ x: this.position.x, y: this.position.y + 24 }, { x: 0, y: 90 }, "HeavyBomb");
    }
  }
  draw(ctx) {
    ctx.save();
    const x = this.position.x;
    const y = this.position.y;
    const hullColor = this.flashTimer > 0 ? "rgb(255, 255, 255)" : "rgb(45, 50, 65)";
    const accentColor = "rgb(200, 50, 50)";

    // Giant Wings
    ctx.fillStyle = hullColor;
    ctx.beginPath();
    ctx.roundRect(x - 75, y - 14, 150, 28, 6);
    ctx.fill();
    ctx.strokeStyle = accentColor;
    ctx.lineWidth = 2;
    ctx.stroke();

    // Central Citadel
    ctx.fillStyle = "rgb(30, 35, 45)";
    ctx.beginPath();
    ctx.roundRect(x - 30, y - 22, 60, 44, 4);
    ctx.fill();
    ctx.strokeStyle = accentColor;
    ctx.stroke();

    // Boss HP Bar
    const hpPct = Math.max(0, this.health / this.maxHealth);
    ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
    ctx.fillRect(x - 60, y - 38, 120, 8);
    ctx.fillStyle = "rgb(255, 30, 30)";
    ctx.fillRect(x - 60, y - 38, 120 * hpPct, 8);
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 1;
    ctx.strokeRect(x - 60, y - 38, 120, 8);

    ctx.restore();
  }
}

class ParticleSystem {
  constructor() {
    this.particles = [];
  }
  spawnExplosion(pos, count = 20, maxSpeed = 240, isCyan = false) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 20 + Math.random() * maxSpeed;
      this.particles.push({
        x: pos.x,
        y: pos.y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 0.35 + Math.random() * 0.45,
        maxLife: 0.8,
        color: isCyan ? "rgb(0, 230, 255)" : (Math.random() < 0.5 ? "rgb(255, 140, 0)" : "rgb(255, 220, 50)"),
        size: 3 + Math.random() * 4
      });
    }
  }
  spawnMuzzleFlash(pos, angleDeg, isCyan = false) {
    const rad = (angleDeg * Math.PI) / 180;
    for (let i = 0; i < 6; i++) {
      const spread = rad + (Math.random() - 0.5) * 0.4;
      const speed = 120 + Math.random() * 200;
      this.particles.push({
        x: pos.x,
        y: pos.y,
        vx: Math.cos(spread) * speed,
        vy: Math.sin(spread) * speed,
        life: 0.15 + Math.random() * 0.15,
        maxLife: 0.3,
        color: isCyan ? "rgb(100, 240, 255)" : "rgb(255, 230, 100)",
        size: 4
      });
    }
  }
  update(dt) {
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      if (p.life <= 0) this.particles.splice(i, 1);
    }
  }
  draw(ctx) {
    ctx.save();
    for (const p of this.particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    }
    ctx.restore();
  }
}

// ----------------------------------------------------------------------------
// GAME RUNNER (Coordinator & Finite State Machine Loop)
// ----------------------------------------------------------------------------
const ScreenWidth = 1280;
const ScreenHeight = 720;
const GroundLevelY = 640;
const StartPosition = { x: 640, y: GroundLevelY };

const GameState = {
  LoadingScreen: 0,
  MainMenu: 1,
  HowToPlay: 2,
  Playing: 3,
  GameOver: 4,
  ReplayTheater: 5
};

class GameRunner {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");

    this.state = GameState.LoadingScreen;
    this.loadingProgress = 0;

    this.player = new PlayerTank(StartPosition);
    this.ghost = new GhostTank(StartPosition);

    this.recorder = new CommandRecorder();
    this.ghostEngine = new GhostPlaybackEngine();
    this.particles = new ParticleSystem();

    this.projectiles = [];
    this.bombs = [];
    this.enemies = [];
    this.supplyDrops = [];

    this.survivalTime = 0;
    this.score = 0;
    this.bestScore = 0;
    this.bestSurvivalTime = 0;
    this.enemiesKilled = 0;
    this.threatLevel = 1;

    this.lastRunTape = [];
    this.lastRunDuration = 0;
    this.lastRunScore = 0;
    this.lastRunKills = 0;
    this.replayTimer = 0;

    this.screenShakeTimer = 0;
    this.shakeOffset = { x: 0, y: 0 };

    this.searchlightAngle1 = -0.6;
    this.searchlightAngle2 = 0.6;
    this.menuSelectedIndex = 0;

    this.commandLogQueue = [];
    this.keys = {};
    this.mouse = { x: 640, y: 360, leftDown: false, rightDown: false };

    this.spawnTimer = 1.0;
    this.supplyTimer = 12.0;
    this.bossTimer = 50.0;

    this.lastTime = performance.now();

    this.initEntities();
    this.initEvents();

    requestAnimationFrame(t => this.loop(t));
  }

  initEntities() {
    this.player.onFireAction = (muzzleTip, angleDeg, isGhost) => {
      sfx.playCannon();
      this.projectiles.push(new Projectile(muzzleTip, angleDeg, 720, isGhost));
      this.particles.spawnMuzzleFlash(muzzleTip, angleDeg, false);
    };

    this.ghost.onFireAction = (muzzleTip, angleDeg, isGhost) => {
      sfx.playCannon();
      this.projectiles.push(new Projectile(muzzleTip, angleDeg, 720, isGhost));
      this.particles.spawnMuzzleFlash(muzzleTip, angleDeg, true);
    };
  }

  addCommandLog(source, msg) {
    this.commandLogQueue.push(`[${source}] ${msg}`);
    if (this.commandLogQueue.length > 6) {
      this.commandLogQueue.shift();
    }
  }

  initEvents() {
    window.addEventListener("keydown", e => {
      this.keys[e.code] = true;
      sfx.init();

      if (this.state === GameState.LoadingScreen) {
        if (e.code === "Space" || e.code === "Enter") this.state = GameState.MainMenu;
      } else if (this.state === GameState.MainMenu) {
        if (e.code === "ArrowUp" || e.code === "KeyW") this.menuSelectedIndex = (this.menuSelectedIndex + 3) % 4;
        if (e.code === "ArrowDown" || e.code === "KeyS") this.menuSelectedIndex = (this.menuSelectedIndex + 1) % 4;
        if (e.code === "Digit1") this.menuSelectedIndex = 0;
        if (e.code === "Digit2") this.menuSelectedIndex = 1;
        if (e.code === "Digit3") this.menuSelectedIndex = 2;
        if (e.code === "Digit4") this.menuSelectedIndex = 3;

        if (e.code === "Enter" || e.code === "Space") this.executeMenuSelection();
      } else if (this.state === GameState.HowToPlay) {
        if (e.code === "Escape" || e.code === "KeyM" || e.code === "Space") this.state = GameState.MainMenu;
      } else if (this.state === GameState.Playing) {
        if (e.code === "Escape" || e.code === "KeyM") this.state = GameState.MainMenu;
      } else if (this.state === GameState.GameOver) {
        if (e.code === "KeyP") this.startReplayTheater();
        if (e.code === "Space" || e.code === "Enter") this.startNewSurvivalRun();
        if (e.code === "KeyM" || e.code === "Escape") this.state = GameState.MainMenu;
      } else if (this.state === GameState.ReplayTheater) {
        if (e.code === "KeyP" || e.code === "Space" || e.code === "Escape") this.exitReplayTheater();
      }
    });

    window.addEventListener("keyup", e => {
      this.keys[e.code] = false;
    });

    this.canvas.addEventListener("mousemove", e => {
      const rect = this.canvas.getBoundingClientRect();
      this.mouse.x = (e.clientX - rect.left) * (ScreenWidth / rect.width);
      this.mouse.y = (e.clientY - rect.top) * (ScreenHeight / rect.height);
    });

    this.canvas.addEventListener("mousedown", e => {
      sfx.init();
      if (e.button === 0) {
        this.mouse.leftDown = true;
        this.handleLeftClick();
      }
      if (e.button === 2) {
        e.preventDefault();
        this.mouse.rightDown = true;
      }
    });

    window.addEventListener("mouseup", e => {
      if (e.button === 0) this.mouse.leftDown = false;
      if (e.button === 2) this.mouse.rightDown = false;
    });

    this.canvas.addEventListener("contextmenu", e => e.preventDefault());
  }

  handleLeftClick() {
    if (this.state === GameState.LoadingScreen) {
      this.state = GameState.MainMenu;
    } else if (this.state === GameState.MainMenu) {
      for (let i = 0; i < 4; i++) {
        const r = this.getMenuButtonRect(i);
        if (this.mouse.x >= r.x && this.mouse.x <= r.x + r.w && this.mouse.y >= r.y && this.mouse.y <= r.y + r.h) {
          this.menuSelectedIndex = i;
          this.executeMenuSelection();
          break;
        }
      }
    } else if (this.state === GameState.HowToPlay) {
      this.state = GameState.MainMenu;
    } else if (this.state === GameState.GameOver) {
      if (this.mouse.y >= ScreenHeight / 2 + 25) {
        if (this.mouse.x < ScreenWidth / 2) this.startReplayTheater();
        else this.startNewSurvivalRun();
      }
    } else if (this.state === GameState.ReplayTheater) {
      this.exitReplayTheater();
    }
  }

  getMenuButtonRect(i) {
    const btnW = 380;
    const btnH = 50;
    const startY = 270;
    const spacing = 64;
    return {
      x: ScreenWidth / 2 - btnW / 2,
      y: startY + i * spacing,
      w: btnW,
      h: btnH
    };
  }

  executeMenuSelection() {
    switch (this.menuSelectedIndex) {
      case 0:
        this.startNewSurvivalRun();
        break;
      case 1:
        this.state = GameState.HowToPlay;
        break;
      case 2:
        if (this.lastRunTape.length > 0) this.startReplayTheater();
        break;
      case 3:
        this.state = GameState.LoadingScreen;
        this.loadingProgress = 0;
        break;
    }
  }

  startNewSurvivalRun() {
    this.survivalTime = 0;
    this.score = 0;
    this.state = GameState.Playing;
    this.enemiesKilled = 0;
    this.threatLevel = 1;

    this.projectiles = [];
    this.bombs = [];
    this.enemies = [];
    this.supplyDrops = [];
    this.particles = new ParticleSystem();
    this.supplyTimer = 12.0;

    this.recorder.startRecording();
    this.player.reset(StartPosition);

    this.ghost.isActive = false;
    this.ghost.isTheaterMode = false;
    this.ghostEngine.stopPlayback();

    this.commandLogQueue = [];
    this.addCommandLog("System", "=== ENDLESS AIR RAID SURVIVAL INITIATED ===");
    this.addCommandLog("System", "Survive as long as possible! Difficulty increases over time.");
  }

  startReplayTheater() {
    if (this.lastRunTape.length === 0) return;

    this.state = GameState.ReplayTheater;
    this.replayTimer = 0;

    this.projectiles = [];
    this.bombs = [];
    this.enemies = [];
    this.supplyDrops = [];
    this.particles = new ParticleSystem();

    this.player.stop();

    this.ghost.isTheaterMode = true;
    this.ghost.reset(StartPosition);
    this.ghostEngine.startPlayback(this.lastRunTape);

    this.addCommandLog("Replay", `🎬 REPLAY THEATER: Playing back run (${this.lastRunTape.length} cmds)`);
  }

  exitReplayTheater() {
    this.ghostEngine.stopPlayback();
    this.ghost.isTheaterMode = false;
    this.ghost.isActive = false;

    this.projectiles = [];
    this.bombs = [];
    this.enemies = [];
    this.particles = new ParticleSystem();

    this.state = GameState.GameOver;
    this.addCommandLog("Replay", "🎬 Exited Replay Theater. Returned to previous screen.");
  }

  loop(timestamp) {
    const dt = Math.min((timestamp - this.lastTime) / 1000, 0.1);
    this.lastTime = timestamp;

    this.update(dt);
    this.draw();

    requestAnimationFrame(t => this.loop(t));
  }

  update(dt) {
    this.particles.update(dt);

    if (this.state === GameState.LoadingScreen) {
      this.loadingProgress += dt * 0.55;
      if (this.loadingProgress >= 1.0) {
        this.loadingProgress = 1.0;
        this.state = GameState.MainMenu;
      }
      return;
    }

    if (this.state === GameState.MainMenu) {
      this.searchlightAngle1 += dt * 0.9;
      this.searchlightAngle2 -= dt * 0.7;

      // Mouse hover button selection
      for (let i = 0; i < 4; i++) {
        const r = this.getMenuButtonRect(i);
        if (this.mouse.x >= r.x && this.mouse.x <= r.x + r.w && this.mouse.y >= r.y && this.mouse.y <= r.y + r.h) {
          this.menuSelectedIndex = i;
          break;
        }
      }
      return;
    }

    if (this.state === GameState.HowToPlay) return;

    // Screen Shake
    if (this.screenShakeTimer > 0) {
      this.screenShakeTimer -= dt;
      this.shakeOffset.x = (Math.random() - 0.5) * 10;
      this.shakeOffset.y = (Math.random() - 0.5) * 10;
    } else {
      this.shakeOffset.x = 0;
      this.shakeOffset.y = 0;
    }

    if (this.state === GameState.ReplayTheater) {
      this.replayTimer += dt;
      this.ghostEngine.update(this.replayTimer, this.ghost);
      this.ghost.updatePhysics(dt, 40, ScreenWidth - 40);

      // Update projectiles & bombs in replay
      for (let i = this.projectiles.length - 1; i >= 0; i--) {
        const p = this.projectiles[i];
        p.update(dt);
        if (!p.isActive) this.projectiles.splice(i, 1);
      }

      if (!this.ghostEngine.isPlaying && this.replayTimer > this.lastRunDuration + 1.2) {
        this.exitReplayTheater();
      }
      return;
    }

    if (this.state === GameState.Playing) {
      this.survivalTime += dt;
      this.threatLevel = Math.min(10, 1 + Math.floor(this.survivalTime / 20));

      // Player Movement Command
      let moveDir = 0;
      if (this.keys["KeyA"] || this.keys["ArrowLeft"]) moveDir -= 1;
      if (this.keys["KeyD"] || this.keys["ArrowRight"]) moveDir += 1;
      if (moveDir !== 0) {
        const cmd = new MoveTankCommand(moveDir);
        cmd.execute(this.player);
        this.recorder.record(cmd, this.survivalTime);
      } else {
        this.player.stop();
      }
      this.player.updatePhysics(dt, 40, ScreenWidth - 40);

      // Turret Aim Command
      const pivot = this.player.turretPivot;
      const dx = this.mouse.x - pivot.x;
      const dy = this.mouse.y - pivot.y;
      let angleDeg = (Math.atan2(dy, dx) * 180) / Math.PI;
      if (angleDeg > -10 && angleDeg < 90) angleDeg = -10;
      if (angleDeg < -170 || angleDeg >= 90) angleDeg = -170;
      const aimCmd = new AimTurretCommand(angleDeg);
      aimCmd.execute(this.player);
      this.recorder.record(aimCmd, this.survivalTime);

      // Fire Cannon Command
      if (this.mouse.leftDown || this.keys["Space"]) {
        if (!this.fireCooldown || this.fireCooldown <= 0) {
          this.fireCooldown = 0.16;
          const fireCmd = new FireCannonCommand();
          fireCmd.execute(this.player);
          this.recorder.record(fireCmd, this.survivalTime);
          this.addCommandLog("Player", "FireCannonCommand");
        }
      }
      if (this.fireCooldown > 0) this.fireCooldown -= dt;

      // Spawning Enemies
      this.spawnTimer -= dt;
      this.supplyTimer -= dt;
      this.bossTimer -= dt;

      const spawnInterval = Math.max(0.4, 2.2 - this.survivalTime * 0.025);
      if (this.spawnTimer <= 0) {
        this.spawnTimer = spawnInterval;
        const flyRight = Math.random() < 0.5;
        const startX = flyRight ? -100 : 1380;
        const startY = 80 + Math.random() * 260;
        const roll = Math.random();

        if (this.survivalTime > 40 && roll < 0.28) {
          this.enemies.push(new AttackHelicopter({ x: startX, y: startY }, flyRight));
        } else if (this.survivalTime > 15 && roll < 0.6) {
          this.enemies.push(new BomberPlane({ x: startX, y: startY }, flyRight));
        } else {
          this.enemies.push(new FighterJet({ x: startX, y: startY }, flyRight));
        }
      }

      if (this.bossTimer <= 0) {
        this.bossTimer = 55;
        this.enemies.push(new BossGunship({ x: 640, y: 130 }));
        this.addCommandLog("Alert", "★ DREADNOUGHT AIR FORTRESS INCOMING! ★");
      }

      if (this.supplyTimer <= 0) {
        this.supplyTimer = 14 + Math.random() * 8;
        this.supplyDrops.push(new SupplyDrop({ x: 120 + Math.random() * 1040, y: 40 }, "ArmorRepair"));
        this.addCommandLog("HQ", "Allied Repair Crate airdropped!");
      }

      // Update Enemies
      for (let i = this.enemies.length - 1; i >= 0; i--) {
        const e = this.enemies[i];
        e.update(dt, this.player.position, (pos, vel, type) => {
          this.bombs.push(new Bomb(pos, vel, type));
        });
        if (!e.isActive) this.enemies.splice(i, 1);
      }

      // Update Supply Drops
      const tb = this.player.bounds;
      for (let i = this.supplyDrops.length - 1; i >= 0; i--) {
        const s = this.supplyDrops[i];
        s.update(dt, GroundLevelY);

        // Pickup collision
        if (Math.abs(s.position.x - this.player.position.x) < 40 && Math.abs(s.position.y - this.player.position.y) < 36) {
          this.player.health = Math.min(this.player.maxHealth, this.player.health + 35);
          this.addCommandLog("HQ", "Armor Repaired +35 HP!");
          sfx.playSupply();
          this.particles.spawnExplosion(s.position, 16, 120, false);
          this.supplyDrops.splice(i, 1);
        }
      }

      // Update Projectiles & Enemy Collisions
      for (let i = this.projectiles.length - 1; i >= 0; i--) {
        const p = this.projectiles[i];
        p.update(dt);

        for (let j = this.enemies.length - 1; j >= 0; j--) {
          const e = this.enemies[j];
          const eb = { x: e.position.x - 30, y: e.position.y - 15, w: 60, h: 30 };
          if (p.position.x >= eb.x && p.position.x <= eb.x + eb.w && p.position.y >= eb.y && p.position.y <= eb.y + eb.h) {
            p.isActive = false;
            e.takeDamage(35);
            this.particles.spawnExplosion(p.position, 8, 140);

            if (e.isDestroyed) {
              sfx.playExplosion();
              this.score += e.scoreValue;
              this.enemiesKilled++;
              this.particles.spawnExplosion(e.position, 35, 260);
              this.enemies.splice(j, 1);
            }
            break;
          }
        }

        if (!p.isActive) this.projectiles.splice(i, 1);
      }

      // Update Bombs & Tank Collisions
      for (let i = this.bombs.length - 1; i >= 0; i--) {
        const b = this.bombs[i];
        b.update(dt, GroundLevelY, this.player.position.x);

        if (b.position.x >= tb.x && b.position.x <= tb.x + tb.width && b.position.y >= tb.y && b.position.y <= tb.y + tb.height) {
          b.isActive = false;
          this.player.takeDamage(b.damage);
          this.screenShakeTimer = 0.25;
          this.particles.spawnExplosion(b.position, 22, 180);
        }

        if (!b.isActive) {
          this.particles.spawnExplosion(b.position, 10, 110);
          this.bombs.splice(i, 1);
        }
      }

      // Check Game Over
      if (!this.player.isAlive) {
        this.state = GameState.GameOver;
        this.screenShakeTimer = 0.5;
        this.recorder.stopRecording();

        this.lastRunTape = this.recorder.getTapeCopy();
        this.lastRunDuration = this.survivalTime;
        this.lastRunScore = this.score;
        this.lastRunKills = this.enemiesKilled;

        if (this.score > this.bestScore) {
          this.bestScore = this.score;
          this.bestSurvivalTime = this.survivalTime;
          this.addCommandLog("System", `★ NEW PERSONAL BEST! Score: ${this.bestScore} ★`);
        }
        this.addCommandLog("System", "MISSION TERMINATED! Press [P] for Replay | [Space] to Play Again");
      }
    }
  }

  // --------------------------------------------------------------------------
  // DRAWING METHODS (Exact Pixel-by-Pixel Raylib-cs Layout)
  // --------------------------------------------------------------------------
  draw() {
    const ctx = this.ctx;
    ctx.save();
    ctx.translate(this.shakeOffset.x, this.shakeOffset.y);
    ctx.clearRect(0, 0, ScreenWidth, ScreenHeight);

    switch (this.state) {
      case GameState.LoadingScreen:
        this.drawLoadingScreen(ctx);
        break;
      case GameState.MainMenu:
        this.drawMainMenu(ctx);
        break;
      case GameState.HowToPlay:
        this.drawHowToPlay(ctx);
        break;
      case GameState.Playing:
      case GameState.GameOver:
      case GameState.ReplayTheater:
        this.drawGameplayWorld(ctx);
        this.drawHUD(ctx);
        break;
    }

    ctx.restore();
  }

  drawLoadingScreen(ctx) {
    ctx.fillStyle = "rgb(10, 14, 22)";
    ctx.fillRect(0, 0, ScreenWidth, ScreenHeight);

    const boxW = 620;
    const boxH = 260;
    const boxX = ScreenWidth / 2 - boxW / 2;
    const boxY = ScreenHeight / 2 - boxH / 2;

    ctx.fillStyle = "rgba(16, 24, 38, 0.9)";
    ctx.fillRect(boxX, boxY, boxW, boxH);
    ctx.strokeStyle = "rgb(60, 90, 130)";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(boxX, boxY, boxW, boxH);

    ctx.fillStyle = "rgb(255, 215, 0)";
    ctx.font = "bold 20px 'Segoe UI', Arial";
    ctx.textAlign = "left";
    ctx.fillText("HEAVY WEAPONS: SYSTEM BOOTSTRAP", boxX + 30, boxY + 48);

    ctx.fillStyle = "rgb(160, 160, 160)";
    ctx.font = "13px 'Segoe UI', Arial";
    ctx.fillText("GI161 Object Oriented Programming for Games | Bangkok University", boxX + 30, boxY + 74);

    let statusText = "[01/04] Initializing WebGL Canvas 2D Graphic Engine...";
    if (this.loadingProgress >= 0.25 && this.loadingProgress < 0.55) {
      statusText = "[02/04] Compiling GoF Command Pattern (ICommand, Receivers)...";
    } else if (this.loadingProgress >= 0.55 && this.loadingProgress < 0.8) {
      statusText = "[03/04] Calibrating Threat Vectoring & Airspace Radar...";
    } else if (this.loadingProgress >= 0.8 && this.loadingProgress < 0.98) {
      statusText = "[04/04] Arming 120mm Armor-Piercing & Atomic Warheads...";
    } else if (this.loadingProgress >= 0.98) {
      statusText = "[SUCCESS] All Systems Nominal. Press [SPACE] to Enter HQ!";
    }

    ctx.fillStyle = this.loadingProgress >= 0.98 ? "rgb(0, 230, 100)" : "rgb(135, 206, 235)";
    ctx.font = "14px 'Segoe UI', Arial";
    ctx.fillText(statusText, boxX + 30, boxY + 130);

    // Progress Bar
    const barW = boxW - 60;
    const barH = 24;
    ctx.fillStyle = "rgb(25, 35, 50)";
    ctx.fillRect(boxX + 30, boxY + 155, barW, barH);
    ctx.strokeStyle = "rgb(80, 80, 80)";
    ctx.strokeRect(boxX + 30, boxY + 155, barW, barH);

    ctx.fillStyle = "rgb(255, 140, 0)";
    ctx.fillRect(boxX + 30, boxY + 155, barW * Math.min(1.0, this.loadingProgress), barH);

    const pct = Math.round(this.loadingProgress * 100);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 13px 'Segoe UI', Arial";
    ctx.textAlign = "center";
    ctx.fillText(`${pct}%`, boxX + boxW / 2, boxY + 172);

    ctx.fillStyle = "rgb(200, 200, 200)";
    ctx.font = "13px 'Segoe UI', Arial";
    ctx.fillText("PRESS [SPACE] OR [ENTER] TO SKIP", boxX + boxW / 2, boxY + 225);
  }

  drawMainMenu(ctx) {
    this.drawBattlefieldBackdrop(ctx);
    this.drawSearchlights(ctx);

    // Title
    ctx.textAlign = "center";
    ctx.font = "bold 62px 'Segoe UI', Arial";
    ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
    ctx.fillText("HEAVY WEAPONS", ScreenWidth / 2 + 4, 164);
    ctx.fillStyle = "rgb(255, 215, 0)";
    ctx.fillText("HEAVY WEAPONS", ScreenWidth / 2, 160);

    ctx.font = "bold 18px 'Segoe UI', Arial";
    ctx.fillStyle = "rgb(135, 206, 235)";
    ctx.fillText("ENDLESS AIR RAID SURVIVAL & COMMAND REPLAY", ScreenWidth / 2, 220);

    // 4 Menu Buttons
    const labels = [
      "1. START MISSION",
      "2. HOW TO PLAY & INTEL",
      this.lastRunTape.length > 0 ? "3. WATCH LAST REPLAY THEATER" : "3. REPLAY THEATER (NO RUN)",
      "4. RESET SIMULATION"
    ];

    for (let i = 0; i < 4; i++) {
      const isSel = (this.menuSelectedIndex === i);
      const r = this.getMenuButtonRect(i);

      ctx.fillStyle = isSel ? "rgba(35, 60, 95, 0.92)" : "rgba(20, 28, 42, 0.82)";
      ctx.fillRect(r.x, r.y, r.w, r.h);
      ctx.strokeStyle = isSel ? "rgb(255, 215, 0)" : "rgb(60, 80, 110)";
      ctx.lineWidth = isSel ? 2.5 : 1.2;
      ctx.strokeRect(r.x, r.y, r.w, r.h);

      ctx.fillStyle = isSel ? "rgb(255, 255, 0)" : (i === 2 && this.lastRunTape.length === 0 ? "rgb(120, 120, 120)" : "#ffffff");
      ctx.font = "bold 18px 'Segoe UI', Arial";
      ctx.textAlign = "center";
      ctx.fillText(labels[i], r.x + r.w / 2, r.y + 32);
    }

    // High Score Box
    ctx.fillStyle = "rgba(15, 22, 34, 0.86)";
    ctx.fillRect(ScreenWidth / 2 - 280, 560, 560, 60);
    ctx.strokeStyle = "rgb(50, 75, 105)";
    ctx.lineWidth = 1.2;
    ctx.strokeRect(ScreenWidth / 2 - 280, 560, 560, 60);

    const min = Math.floor(this.bestSurvivalTime / 60);
    const sec = (this.bestSurvivalTime % 60).toFixed(1);
    ctx.textAlign = "left";
    ctx.fillStyle = "rgb(255, 215, 0)";
    ctx.font = "bold 15px 'Segoe UI', Arial";
    ctx.fillText(`★ HIGH SCORE RECORD: ${this.bestScore} PTS`, ScreenWidth / 2 - 250, 586);

    ctx.fillStyle = "rgb(135, 206, 235)";
    ctx.fillText(`LONGEST SURVIVAL: ${String(min).padStart(2, '0')}:${String(sec).padStart(4, '0')}`, ScreenWidth / 2 + 50, 586);

    ctx.fillStyle = "rgb(140, 140, 140)";
    ctx.font = "12px 'Segoe UI', Arial";
    ctx.textAlign = "center";
    ctx.fillText("GI161 OOP for Games | Bangkok University", ScreenWidth / 2, 610);

    ctx.fillStyle = "rgb(190, 190, 190)";
    ctx.font = "14px 'Segoe UI', Arial";
    ctx.fillText("[UP/DOWN] or [1-4] Select | [ENTER] / [SPACE] Confirm | [CLICK] Directly", ScreenWidth / 2, ScreenHeight - 34);
  }

  drawSearchlights(ctx) {
    const l1X = ScreenWidth * 0.25;
    const l2X = ScreenWidth * 0.75;

    const tip1X = l1X + Math.sin(this.searchlightAngle1) * 320;
    const tip2X = l2X + Math.sin(this.searchlightAngle2) * 320;

    ctx.save();
    ctx.fillStyle = "rgba(255, 255, 200, 0.08)";
    ctx.beginPath();
    ctx.moveTo(l1X, GroundLevelY);
    ctx.lineTo(tip1X - 50, 60);
    ctx.lineTo(tip1X + 50, 60);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(l2X, GroundLevelY);
    ctx.lineTo(tip2X - 50, 60);
    ctx.lineTo(tip2X + 50, 60);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  drawBattlefieldBackdrop(ctx) {
    // Vertical Sky Gradient
    const grad = ctx.createLinearGradient(0, 0, 0, GroundLevelY);
    grad.addColorStop(0, "rgb(10, 14, 26)");
    grad.addColorStop(1, "rgb(25, 35, 60)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, ScreenWidth, GroundLevelY);

    // Distant Mountains
    ctx.fillStyle = "rgb(18, 24, 40)";
    ctx.beginPath();
    ctx.moveTo(0, GroundLevelY);
    ctx.lineTo(240, 480);
    ctx.lineTo(500, GroundLevelY);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "rgb(22, 28, 48)";
    ctx.beginPath();
    ctx.moveTo(380, GroundLevelY);
    ctx.lineTo(700, 430);
    ctx.lineTo(1040, GroundLevelY);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "rgb(18, 24, 40)";
    ctx.beginPath();
    ctx.moveTo(900, GroundLevelY);
    ctx.lineTo(1150, 490);
    ctx.lineTo(1280, GroundLevelY);
    ctx.closePath();
    ctx.fill();

    // Trench Bunker & Radar Antenna with Blinking Red Beacon
    ctx.fillStyle = "rgb(32, 42, 54)";
    ctx.fillRect(140, GroundLevelY - 45, 60, 45);
    ctx.strokeStyle = "rgb(120, 120, 120)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(170, GroundLevelY - 45);
    ctx.lineTo(170, GroundLevelY - 80);
    ctx.stroke();

    ctx.fillStyle = Math.floor(performance.now() / 400) % 2 === 0 ? "rgb(255, 30, 30)" : "rgb(100, 0, 0)";
    ctx.beginPath();
    ctx.arc(170, GroundLevelY - 80, 8, 0, Math.PI * 2);
    ctx.fill();

    // Ground Dirt & Grass Strip
    ctx.fillStyle = "rgb(42, 48, 40)";
    ctx.fillRect(0, GroundLevelY, ScreenWidth, ScreenHeight - GroundLevelY);

    ctx.strokeStyle = "rgb(110, 130, 95)";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(0, GroundLevelY);
    ctx.lineTo(ScreenWidth, GroundLevelY);
    ctx.stroke();

    // Barbed wire ground details
    ctx.strokeStyle = "rgba(75, 80, 50, 0.6)";
    ctx.lineWidth = 3;
    for (let x = 0; x < ScreenWidth; x += 60) {
      ctx.beginPath();
      ctx.moveTo(x, GroundLevelY + 4);
      ctx.lineTo(x + 30, GroundLevelY + 22);
      ctx.stroke();
    }
  }

  drawHowToPlay(ctx) {
    this.drawBattlefieldBackdrop(ctx);

    const cardW = 960;
    const cardH = 560;
    const cardX = ScreenWidth / 2 - cardW / 2;
    const cardY = 50;

    ctx.fillStyle = "rgba(16, 22, 34, 0.94)";
    ctx.fillRect(cardX, cardY, cardW, cardH);
    ctx.strokeStyle = "rgb(255, 215, 0)";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(cardX, cardY, cardW, cardH);

    ctx.fillStyle = "rgb(255, 215, 0)";
    ctx.font = "bold 24px 'Segoe UI', Arial";
    ctx.textAlign = "left";
    ctx.fillText("MISSION INTEL & COMBAT CONTROLS", cardX + 35, cardY + 48);

    ctx.fillStyle = "rgb(150, 150, 150)";
    ctx.font = "13px 'Segoe UI', Arial";
    ctx.fillText("Heavy Weapons Operation Manual | Command Pattern Architecture", cardX + 35, cardY + 74);

    // Section 1
    ctx.fillStyle = "rgb(135, 206, 235)";
    ctx.font = "bold 18px 'Segoe UI', Arial";
    ctx.fillText("1. TANK CONTROLS (PLAYER RECEIVER)", cardX + 35, cardY + 120);

    ctx.fillStyle = "#ffffff";
    ctx.font = "15px 'Segoe UI', Arial";
    ctx.fillText("• [A / D] or [Left / Right]: Drive Tank across ground trench", cardX + 50, cardY + 148);
    ctx.fillText("• [Mouse Cursor]: Aim cannon turret with 360 upward arc", cardX + 50, cardY + 172);
    ctx.fillText("• [Spacebar / Left-Click]: Fire 120mm High-Explosive Shells", cardX + 50, cardY + 196);
    ctx.fillStyle = "rgb(255, 140, 0)";
    ctx.fillText("• [Right-Click / B / F]: Deploy Atomic Warhead (Wipes active airspace!)", cardX + 50, cardY + 220);

    // Section 2
    ctx.fillStyle = "rgb(135, 206, 235)";
    ctx.font = "bold 18px 'Segoe UI', Arial";
    ctx.fillText("2. ENEMY AIRCRAFT THREATS (POLYMORPHIC ENEMIES)", cardX + 35, cardY + 268);

    ctx.fillStyle = "#ffffff";
    ctx.font = "15px 'Segoe UI', Arial";
    ctx.fillText("• Fighter Jet: High speed with Delta wings, fires twin laser machine guns (12 DMG)", cardX + 50, cardY + 296);
    ctx.fillStyle = "rgb(255, 215, 0)";
    ctx.fillText("• Heavy Bomber: Strategic payload carrier, drops devastating gravity bombs (35 DMG!)", cardX + 50, cardY + 320);
    ctx.fillStyle = "#ffffff";
    ctx.fillText("• Gunship Heli: Undulating flight pattern, locks and fires guided rockets (24 DMG)", cardX + 50, cardY + 344);
    ctx.fillStyle = "rgb(255, 60, 60)";
    ctx.fillText("• Dreadnought Air Fortress: Massive aerial boss gunship arriving every 50 seconds", cardX + 50, cardY + 368);

    // Section 3
    ctx.fillStyle = "rgb(135, 206, 235)";
    ctx.font = "bold 18px 'Segoe UI', Arial";
    ctx.fillText("3. SUPPLY CRATES & REPLAY THEATER", cardX + 35, cardY + 416);

    ctx.fillStyle = "rgb(0, 230, 100)";
    ctx.font = "15px 'Segoe UI', Arial";
    ctx.fillText("• Allied Parachutes: Grab Green crates to restore +35 HP!", cardX + 50, cardY + 444);
    ctx.fillStyle = "rgb(255, 215, 0)";
    ctx.fillText("• Replay Theater: When destroyed, press [P] to watch spectator replay of your run!", cardX + 50, cardY + 468);

    // Return button
    ctx.fillStyle = "rgba(30, 50, 80, 0.9)";
    ctx.fillRect(cardX + cardW / 2 - 160, cardY + cardH - 58, 320, 40);
    ctx.strokeStyle = "rgb(255, 215, 0)";
    ctx.strokeRect(cardX + cardW / 2 - 160, cardY + cardH - 58, 320, 40);

    ctx.fillStyle = "#ffffff";
    ctx.textAlign = "center";
    ctx.font = "bold 15px 'Segoe UI', Arial";
    ctx.fillText("PRESS [ESC] OR [SPACE] TO RETURN", cardX + cardW / 2, cardY + cardH - 33);
  }

  drawGameplayWorld(ctx) {
    this.drawBattlefieldBackdrop(ctx);

    if (this.state === GameState.ReplayTheater) {
      this.ghost.draw(ctx);
    } else {
      this.player.draw(ctx);
    }

    for (const crate of this.supplyDrops) crate.draw(ctx);
    for (const enemy of this.enemies) enemy.draw(ctx);
    for (const bomb of this.bombs) bomb.draw(ctx);
    for (const proj of this.projectiles) proj.draw(ctx);

    this.particles.draw(ctx);

    if (this.state === GameState.Playing) {
      this.drawAimCrosshair(ctx);
    }
  }

  drawAimCrosshair(ctx) {
    const mx = this.mouse.x;
    const my = this.mouse.y;
    if (my < GroundLevelY) {
      ctx.save();
      ctx.strokeStyle = "rgb(0, 230, 100)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(mx, my, 12, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = "rgb(255, 215, 0)";
      ctx.beginPath();
      ctx.arc(mx, my, 4, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = "rgb(0, 230, 100)";
      ctx.beginPath();
      ctx.moveTo(mx - 16, my);
      ctx.lineTo(mx + 16, my);
      ctx.moveTo(mx, my - 16);
      ctx.lineTo(mx, my + 16);
      ctx.stroke();
      ctx.restore();
    }
  }

  drawHUD(ctx) {
    if (this.state === GameState.ReplayTheater) {
      ctx.fillStyle = "rgba(10, 20, 36, 0.9)";
      ctx.fillRect(0, 0, ScreenWidth, 54);
      ctx.strokeStyle = "rgb(255, 215, 0)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 54);
      ctx.lineTo(ScreenWidth, 54);
      ctx.stroke();

      ctx.fillStyle = "rgb(255, 215, 0)";
      ctx.font = "bold 18px 'Segoe UI', Arial";
      ctx.textAlign = "left";
      ctx.fillText(`🎬 REPLAY THEATER - PLAYING BACK LAST SURVIVAL RUN (${this.lastRunTape.length} COMMANDS)`, 24, 34);

      ctx.fillStyle = "rgb(135, 206, 235)";
      ctx.font = "16px 'Segoe UI', Arial";
      ctx.fillText(`TIME: ${this.replayTimer.toFixed(1)}s / ${this.lastRunDuration.toFixed(1)}s`, 700, 34);

      ctx.fillStyle = "rgb(255, 255, 0)";
      ctx.font = "14px 'Segoe UI', Arial";
      ctx.fillText("Press [P], [SPACE], or [ESC] to Exit Replay", ScreenWidth - 360, 34);

      const progressRatio = this.lastRunDuration > 0 ? Math.min(1.0, this.replayTimer / this.lastRunDuration) : 0;
      ctx.fillStyle = "rgb(255, 140, 0)";
      ctx.fillRect(0, 52, ScreenWidth * progressRatio, 4);
      return;
    }

    // Top-Left Info Card
    ctx.fillStyle = "rgba(15, 22, 36, 0.84)";
    ctx.fillRect(16, 16, 400, 110);
    ctx.strokeStyle = "rgb(70, 90, 120)";
    ctx.lineWidth = 1.2;
    ctx.strokeRect(16, 16, 400, 110);

    const minutes = Math.floor(this.survivalTime / 60);
    const seconds = (this.survivalTime % 60).toFixed(1);
    ctx.textAlign = "left";
    ctx.fillStyle = "rgb(255, 215, 0)";
    ctx.font = "bold 21px 'Segoe UI', Arial";
    ctx.fillText(`SURVIVAL: ${String(minutes).padStart(2, '0')}:${String(seconds).padStart(4, '0')}`, 30, 46);

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 20px 'Segoe UI', Arial";
    ctx.fillText(`SCORE: ${this.score}`, 30, 74);

    ctx.fillStyle = "rgb(100, 220, 255)";
    ctx.font = "16px 'Segoe UI', Arial";
    ctx.fillText(`BEST SCORE: ${this.bestScore}`, 30, 102);

    ctx.fillStyle = "rgb(255, 140, 0)";
    ctx.fillText(`THREAT: LEVEL ${this.threatLevel}`, 235, 48);

    ctx.fillStyle = "rgb(200, 200, 200)";
    ctx.fillText(`KILLS: ${this.enemiesKilled}`, 235, 102);

    // Top-Right Command Stream HUD
    ctx.fillStyle = "rgba(15, 22, 36, 0.88)";
    ctx.fillRect(ScreenWidth - 490, 16, 474, 130);
    ctx.strokeStyle = "rgb(70, 90, 120)";
    ctx.strokeRect(ScreenWidth - 490, 16, 474, 130);

    ctx.fillStyle = "rgb(135, 206, 235)";
    ctx.font = "bold 13px 'Segoe UI', Arial";
    ctx.fillText("GOF COMMAND STREAM RECORDER", ScreenWidth - 478, 36);

    ctx.fillStyle = "rgb(140, 140, 140)";
    ctx.font = "11px 'Segoe UI', Arial";
    ctx.fillText(`Tape Size: ${this.recorder.commandCount} cmds | Last Run: ${this.lastRunTape.length} cmds`, ScreenWidth - 478, 54);

    let logY = 74;
    for (const log of this.commandLogQueue) {
      ctx.fillStyle = log.includes("Player") ? "rgb(0, 230, 100)" : (log.includes("Alert") ? "rgb(255, 60, 60)" : "rgb(255, 215, 0)");
      ctx.fillText(log, ScreenWidth - 478, logY);
      logY += 15;
    }

    // Bottom-Left Health Bar
    ctx.fillStyle = "rgba(15, 22, 36, 0.88)";
    ctx.fillRect(16, ScreenHeight - 56, 420, 42);
    ctx.strokeStyle = "rgb(70, 90, 120)";
    ctx.strokeRect(16, ScreenHeight - 56, 420, 42);

    ctx.fillStyle = "rgb(200, 200, 200)";
    ctx.font = "bold 13px 'Segoe UI', Arial";
    ctx.fillText("ARMOR", 24, ScreenHeight - 30);

    const hpRatio = Math.max(0, this.player.health / this.player.maxHealth);
    ctx.fillStyle = "rgb(60, 60, 60)";
    ctx.fillRect(80, ScreenHeight - 48, 180, 18);

    ctx.fillStyle = hpRatio > 0.5 ? "rgb(0, 200, 80)" : (hpRatio > 0.25 ? "rgb(255, 215, 0)" : "rgb(230, 40, 40)");
    ctx.fillRect(80, ScreenHeight - 48, 180 * hpRatio, 18);

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 12px 'Segoe UI', Arial";
    ctx.fillText(`${Math.round(this.player.health)} / ${this.player.maxHealth}`, 140, ScreenHeight - 34);


    // Bottom-Right Controls Hint
    ctx.fillStyle = "rgb(240, 240, 240)";
    ctx.font = "13px 'Segoe UI', Arial";
    ctx.textAlign = "right";
    ctx.fillText("[A/D] Move | [Mouse] Aim | [Space/L-Click] Fire | [ESC] Menu", ScreenWidth - 24, ScreenHeight - 30);

    // Game Over Overlay
    if (this.state === GameState.GameOver) {
      ctx.fillStyle = "rgba(30, 10, 10, 0.96)";
      ctx.fillRect(0, ScreenHeight / 2 - 110, ScreenWidth, 220);
      ctx.strokeStyle = "rgb(255, 30, 30)";
      ctx.lineWidth = 2;
      ctx.strokeRect(0, ScreenHeight / 2 - 110, ScreenWidth, 220);

      ctx.fillStyle = "rgb(255, 40, 40)";
      ctx.font = "bold 36px 'Segoe UI', Arial";
      ctx.textAlign = "center";
      ctx.fillText("MISSION TERMINATED - TANK DESTROYED", ScreenWidth / 2, ScreenHeight / 2 - 55);

      ctx.fillStyle = "#ffffff";
      ctx.font = "20px 'Segoe UI', Arial";
      ctx.fillText(`Time Survived: ${this.lastRunDuration.toFixed(1)}s | Hostiles Neutralized: ${this.lastRunKills} aircraft`, ScreenWidth / 2, ScreenHeight / 2 - 15);

      ctx.fillStyle = "rgb(135, 206, 235)";
      ctx.font = "18px 'Segoe UI', Arial";
      ctx.fillText(`Final Score: ${this.lastRunScore} pts | Recorded Commands: ${this.lastRunTape.length} cmds`, ScreenWidth / 2, ScreenHeight / 2 + 18);

      ctx.fillStyle = "rgb(255, 215, 0)";
      ctx.font = "bold 18px 'Segoe UI', Arial";
      ctx.fillText("[P] WATCH REPLAY | [SPACE] PLAY AGAIN | [M] / [ESC] MAIN MENU", ScreenWidth / 2, ScreenHeight / 2 + 65);
    }
  }
}

// Start Game on load
window.addEventListener("DOMContentLoaded", () => {
  const canvas = document.getElementById("gameCanvas");
  new GameRunner(canvas);
});
</script>
