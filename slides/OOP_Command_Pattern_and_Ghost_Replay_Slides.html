<header>Week 8 : Command Pattern &amp; Ghost Replay Engine in 2D Speedrun Platformer</header>
<h1 id="%F0%9F%92%A5-part-0-%E0%B8%9B%E0%B8%B1%E0%B8%8D%E0%B8%AB%E0%B8%B2%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B8%9C%E0%B8%B9%E0%B8%81%E0%B8%95%E0%B8%B4%E0%B8%94%E0%B8%AE%E0%B8%B2%E0%B8%A3%E0%B9%8C%E0%B8%94%E0%B9%81%E0%B8%A7%E0%B8%A3%E0%B9%8C-the-direct-input-anti-pattern"><img class="emoji" draggable="false" alt="💥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a5.svg" data-marp-twemoji=""/> Part 0: ปัญหาของการผูกติดฮาร์ดแวร์ (The Direct Input Anti-Pattern)</h1>
<p>ในเกมระดับเริ่มต้น นักศึกษามักเขียนโค้ดอ่านคีย์บอร์ดลงใน <code>Update()</code> ของคลาสตัวละครโดยตรง:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-csharp"><span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Direct Hardware Polling Anti-Pattern</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title">Player</span>
{
    <span class="hljs-function"><span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title">Update</span>(<span class="hljs-params"><span class="hljs-built_in">float</span> dt</span>)</span>
    {
        <span class="hljs-keyword">if</span> (Raylib.IsKeyDown(KeyboardKey.D))
            Position.X += speed * dt;
        <span class="hljs-keyword">if</span> (Raylib.IsKeyPressed(KeyboardKey.Space) &amp;&amp; isGrounded)
            Velocity.Y = -jumpForce;
    }
}
</code></pre>
<ul>
<li><strong>ข้อจำกัดรุนแรง 4 ประการ:</strong>
<ol>
<li><span class="red">No Rebinding:</span> ไม่สามารถเปลี่ยนปุ่มควบคุมหรือสลับไปใช้ Gamepad / Mobile Touch ได้อย่างยืดหยุ่น</li>
<li><span class="red">No Ghost / AI Injection:</span> บอทหรือร่างเงาไม่สามารถสั่งการตัวละครได้ เพราะติดเช็คคีย์บอร์ดจริง</li>
<li><span class="red">No Replay System:</span> ไม่สามารถบันทึกและย้อนดูการเล่นซ้ำได้เลย</li>
<li><span class="red">Untestable:</span> ไม่สามารถเขียน Automated Unit Test จำลองการเล่นได้</li>
</ol>
</li>
</ul>

<header>Week 8 : Command Pattern &amp; Ghost Replay Engine in 2D Speedrun Platformer</header>
<h1 id="%F0%9F%92%A1-%E0%B8%97%E0%B8%B2%E0%B8%87%E0%B8%AD%E0%B8%AD%E0%B8%81-%E0%B9%81%E0%B8%81%E0%B9%88%E0%B8%99%E0%B9%81%E0%B8%97%E0%B9%89%E0%B8%82%E0%B8%AD%E0%B8%87-command-pattern-gof"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> ทางออก: แก่นแท้ของ Command Pattern (GoF)</h1>
<blockquote>
<p><em>&quot;Encapsulate a request as an object, thereby letting you parameterize clients with different requests, queue or log requests, and support undoable operations.&quot;</em><br />
— <strong>Gang of Four (Design Patterns: Elements of Reusable Object-Oriented Software)</strong></p>
</blockquote>
<br />
<ul>
<li>แทนที่การกดปุ่มจะสั่งเปลี่ยนค่า <code>Position</code> หรือ <code>Velocity</code> ทันที...</li>
<li><strong>เราเปลี่ยน &quot;เจตนาในการกระทำ&quot; (Action Intent) ให้กลายเป็น First-Class Object</strong></li>
<li>คำสั่งกลายเป็นก้อนข้อมูล (<code>ICommand</code>) ที่สามารถ:
<ul>
<li><span class="green">ส่งต่อ (Pass around)</span> เป็นพารามิเตอร์ของเมธอด</li>
<li><span class="yellow">เข้าคิว (Queue)</span> หรือจัดลำดับก่อนหลัง</li>
<li><span class="cyan">ประทับเวลา (Timestamp)</span> เพื่อบันทึกลงใน Replay Stream</li>
<li><span class="blue">ส่งข้ามเครือข่าย (Serialize over Network)</span> ไปยังเครื่องอื่น</li>
</ul>
</li>
</ul>

<header>Week 8 : Command Pattern &amp; Ghost Replay Engine in 2D Speedrun Platformer</header>
<h1 id="%F0%9F%8F%9B%EF%B8%8F-4-%E0%B8%AD%E0%B8%87%E0%B8%84%E0%B9%8C%E0%B8%9B%E0%B8%A3%E0%B8%B0%E0%B8%81%E0%B8%AD%E0%B8%9A%E0%B8%AB%E0%B8%A5%E0%B8%B1%E0%B8%81%E0%B8%82%E0%B8%AD%E0%B8%87-command-pattern"><img class="emoji" draggable="false" alt="🏛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3db.svg" data-marp-twemoji=""/> 4 องค์ประกอบหลักของ Command Pattern</h1>
<table>
<thead>
<tr>
<th style="text-align:left">องค์ประกอบ (Role)</th>
<th style="text-align:left">หน้าที่และความรับผิดชอบ</th>
<th style="text-align:left">ตัวอย่างในเกม Platformer ของเรา</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>1. Command Interface</strong></td>
<td style="text-align:left">สัญญาอินเทอร์เฟซกำหนดเมธอด <code>Execute(Receiver)</code></td>
<td style="text-align:left"><code>ICommand</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>2. Concrete Commands</strong></td>
<td style="text-align:left">คลาสคำสั่งรูปธรรม บรรจุพารามิเตอร์ของการกระทำ</td>
<td style="text-align:left"><code>MoveCommand</code>, <code>JumpCommand</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>3. Receiver</strong></td>
<td style="text-align:left">ผู้ลงมือปฏิบัติงานจริงตามกฎฟิสิกส์ของโลกเกม</td>
<td style="text-align:left"><code>IPlatformerCharacter</code><br />(<code>MarioPlayer</code>, <code>GhostRunner</code>)</td>
</tr>
<tr>
<td style="text-align:left"><strong>4. Invoker</strong></td>
<td style="text-align:left">ผู้ถือคำสั่ง เรียกใช้ <code>Execute()</code> หรือส่งเข้าคิว</td>
<td style="text-align:left"><code>InputHandler</code> (Live)<br /><code>GhostPlaybackEngine</code> (Replay)</td>
</tr>
</tbody>
</table>
<br />
<blockquote>
<p>[!NOTE]<br />
ผู้เล่นสด (<code>MarioPlayer</code>) และร่างเงา (<code>GhostRunner</code>) ต่างเป็น <strong>Receiver</strong> ที่ใช้อินเทอร์เฟซเดียวกัน ทำให้คำสั่งชุดเดียวกันสามารถนำไปรันซ้ำกับตัวละครใดก็ได้แบบ Polymorphic!</p>
</blockquote>

<h1 id="%F0%9F%8F%81-case-study-1-trackmania--mario-kart-time-attack"><img class="emoji" draggable="false" alt="🏁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3c1.svg" data-marp-twemoji=""/> Case Study 1: Trackmania / Mario Kart Time Attack</h1>
<h2 id="ghost-car-replay--asynchronous-racing">Ghost Car Replay &amp; Asynchronous Racing</h2>
<div class="case-screenshot-container">
  <img src="images/case_01_trackmania_ghost.png" alt="Trackmania Ghost Car Racing" />
  <div class="case-credit">TrackMania: แข่งขันจับเวลาควบคู่ไปกับรถร่างเงาโปร่งแสง (Ghost Car) จากสถิติที่ดีที่สุดของผู้เล่น</div>
</div>
<ul>
<li><strong>กลไกสถาปัตยกรรม:</strong>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-csharp"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title">MoveCommand</span> : <span class="hljs-title">ICommand</span>
{
    <span class="hljs-keyword">public</span> <span class="hljs-built_in">float</span> DirectionX { <span class="hljs-keyword">get</span>; }
    <span class="hljs-function"><span class="hljs-keyword">public</span> <span class="hljs-title">MoveCommand</span>(<span class="hljs-params"><span class="hljs-built_in">float</span> directionX</span>)</span> =&gt; DirectionX = directionX;

    <span class="hljs-function"><span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title">Execute</span>(<span class="hljs-params">IPlatformerCharacter target</span>)</span>
    {
        <span class="hljs-keyword">if</span> (DirectionX != <span class="hljs-number">0f</span>) target.Move(DirectionX);
        <span class="hljs-keyword">else</span> target.Stop();
    }
    <span class="hljs-function"><span class="hljs-keyword">public</span> <span class="hljs-keyword">override</span> <span class="hljs-built_in">string</span> <span class="hljs-title">ToString</span>()</span> =&gt; <span class="hljs-string">$&quot;Move(<span class="hljs-subst">{DirectionX:F1}</span>)&quot;</span>;
}

<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title">JumpCommand</span> : <span class="hljs-title">ICommand</span>
{
    <span class="hljs-function"><span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title">Execute</span>(<span class="hljs-params">IPlatformerCharacter target</span>)</span>
    {
        target.Jump();
    }
    <span class="hljs-function"><span class="hljs-keyword">public</span> <span class="hljs-keyword">override</span> <span class="hljs-built_in">string</span> <span class="hljs-title">ToString</span>()</span> =&gt; <span class="hljs-string">&quot;Jump()&quot;</span>;
}

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-csharp"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title">InputHandler</span>
{
    <span class="hljs-keyword">private</span> <span class="hljs-built_in">float</span> _lastDirectionX = <span class="hljs-number">0f</span>;

    <span class="hljs-keyword">public</span> ICommand? CheckHorizontalMovement()
    {
        <span class="hljs-built_in">float</span> dir = <span class="hljs-number">0f</span>;
        <span class="hljs-keyword">if</span> (Raylib.IsKeyDown(KeyboardKey.D) || Raylib.IsKeyDown(KeyboardKey.Right)) dir += <span class="hljs-number">1f</span>;
        <span class="hljs-keyword">if</span> (Raylib.IsKeyDown(KeyboardKey.A) || Raylib.IsKeyDown(KeyboardKey.Left)) dir -= <span class="hljs-number">1f</span>;

        <span class="hljs-comment">// บันทึกเฉพาะเมื่อมีการเปลี่ยนทิศทาง (Event-Driven Input Stream)</span>
        <span class="hljs-keyword">if</span> (dir != _lastDirectionX)
        {
            _lastDirectionX = dir;
            <span class="hljs-keyword">return</span> <span class="hljs-keyword">new</span> MoveCommand(dir);
        }
        <span class="hljs-keyword">return</span> <span class="hljs-literal">null</span>;
    }

    <span class="hljs-keyword">public</span> ICommand? CheckJump()
    {
        <span class="hljs-keyword">if</span> (Raylib.IsKeyPressed(KeyboardKey.Space) || Raylib.IsKeyPressed(KeyboardKey.W))
            <span class="hljs-keyword">return</span> <span class="hljs-keyword">new</span> JumpCommand();
        <span class="hljs-keyword">return</span> <span class="hljs-literal">null</span>;
    }
}

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-csharp"><span class="hljs-function"><span class="hljs-keyword">public</span> <span class="hljs-keyword">readonly</span> <span class="hljs-keyword">record</span> <span class="hljs-keyword">struct</span> <span class="hljs-title">TimedCommand</span>(<span class="hljs-params"><span class="hljs-built_in">float</span> Timestamp, ICommand Command</span>)</span>;

<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title">CommandRecorder</span>
{
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">readonly</span> List&lt;TimedCommand&gt; _tape = <span class="hljs-keyword">new</span>(<span class="hljs-number">256</span>);
    <span class="hljs-keyword">public</span> <span class="hljs-built_in">bool</span> IsRecording { <span class="hljs-keyword">get</span>; <span class="hljs-keyword">private</span> <span class="hljs-keyword">set</span>; }

    <span class="hljs-function"><span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title">StartRecording</span>()</span> { _tape.Clear(); IsRecording = <span class="hljs-literal">true</span>; }
    
    <span class="hljs-function"><span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title">Record</span>(<span class="hljs-params"><span class="hljs-built_in">float</span> timestamp, ICommand command</span>)</span>
    {
        <span class="hljs-keyword">if</span> (IsRecording)
            _tape.Add(<span class="hljs-keyword">new</span> TimedCommand(timestamp, command));
    }

    <span class="hljs-function"><span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title">StopRecording</span>()</span> =&gt; IsRecording = <span class="hljs-literal">false</span>;
    <span class="hljs-function"><span class="hljs-keyword">public</span> List&lt;TimedCommand&gt; <span class="hljs-title">GetTapeCopy</span>()</span> =&gt; <span class="hljs-keyword">new</span>(_tape);
}
</code></pre>

<header>Week 8 : Command Pattern &amp; Ghost Replay Engine in 2D Speedrun Platformer</header>
<h1 id="%F0%9F%91%BB-c-implementation---ghost-playback-engine"><img class="emoji" draggable="false" alt="👻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f47b.svg" data-marp-twemoji=""/> C# Implementation - Ghost Playback Engine</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-csharp"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title">GhostPlaybackEngine</span>
{
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">readonly</span> List&lt;TimedCommand&gt; _ghostTape = <span class="hljs-keyword">new</span>(<span class="hljs-number">256</span>);
    <span class="hljs-keyword">private</span> <span class="hljs-built_in">int</span> _playbackIndex = <span class="hljs-number">0</span>;

    <span class="hljs-function"><span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title">Update</span>(<span class="hljs-params"><span class="hljs-built_in">float</span> currentLevelTime, GhostRunner ghost</span>)</span>
    {
        <span class="hljs-keyword">if</span> (!IsActive || !ghost.IsActive) <span class="hljs-keyword">return</span>;

        <span class="hljs-comment">// ประมวลผลคำสั่งทั้งหมดที่ถึงเวลา Execute ณ เสี้ยววินาทีนี้</span>
        <span class="hljs-keyword">while</span> (_playbackIndex &lt; _ghostTape.Count &amp;&amp; 
               currentLevelTime &gt;= _ghostTape[_playbackIndex].Timestamp)
        {
            _ghostTape[_playbackIndex].Command.Execute(ghost);
            _playbackIndex++;
        }
    }
}
</code></pre>
<ul>
<li>ตัวจักร Ghost ไม่ต้องมี AI ซับซ้อน เพียงแค่หยิบคำสั่งในเทปที่ประทับเวลาตรงกับ <code>_levelTimer</code> มา Execute ลงบน <code>GhostRunner</code>!</li>
</ul>

<header>Week 8 : Command Pattern &amp; Ghost Replay Engine in 2D Speedrun Platformer</header>
<h1 id="%F0%9F%8F%97%EF%B8%8F-%E0%B8%AA%E0%B8%A3%E0%B8%B8%E0%B8%9B%E0%B8%AB%E0%B8%A5%E0%B8%B1%E0%B8%81%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B8%AD%E0%B8%AD%E0%B8%81%E0%B9%81%E0%B8%9A%E0%B8%9A%E0%B8%95%E0%B8%B2%E0%B8%A1-clean-architecture--solid"><img class="emoji" draggable="false" alt="🏗️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3d7.svg" data-marp-twemoji=""/> สรุปหลักการออกแบบตาม Clean Architecture &amp; SOLID</h1>
<ul>
<li><strong>Open/Closed Principle (OCP):</strong>
<ul>
<li>ต้องการเพิ่มสกิลใหม่ (เช่น <code>DashCommand</code>, <code>SlideCommand</code>)?</li>
<li>เพียงแค่สร้างคลาสใหม่ที่ <code>implements ICommand</code> โดยไม่ต้องแก้ไขโค้ดของ <code>InputHandler</code> หรือ <code>GhostPlaybackEngine</code> แม้แต่บรรทัดเดียว!</li>
</ul>
</li>
<li><strong>Single Responsibility Principle (SRP):</strong>
<ul>
<li><code>InputHandler</code> รับผิดชอบเฉพาะการอ่านและแปลงสัญญาณฮาร์ดแวร์</li>
<li><code>CommandRecorder</code> รับผิดชอบเฉพาะการจัดเก็บกระแสคำสั่ง</li>
<li><code>GhostPlaybackEngine</code> รับผิดชอบเฉพาะการเล่นย้อนเทป</li>
<li><code>MarioPlayer</code> / <code>GhostRunner</code> รับผิดชอบเฉพาะกฎฟิสิกส์และการวาดภาพ</li>
</ul>
</li>
</ul>
